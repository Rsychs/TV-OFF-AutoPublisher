name: TV OFF Cloud Studio — autonomous Short

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_page_url:
        description: "Pexels source page (optional; default is the approved Midnight Blue rain-window clip)"
        required: false
        type: string
      title:
        description: "Short title"
        required: false
        type: string
        default: "Midnight Blue"
      duration_seconds:
        description: "Output duration"
        required: false
        type: choice
        options: ["20", "30", "40", "50", "60"]
        default: "30"

permissions:
  contents: read

concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  render:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 15 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'Rsychs' &&
       github.event.comment.body == '/tv-off-studio')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check numpy requests scipy

      - name: Render original TV OFF Short from verified Pexels footage
        env:
          SOURCE_PAGE_URL: ${{ inputs.source_page_url || 'https://www.pexels.com/video/a-window-with-rain-falling-on-it-and-a-pillow-26586651/' }}
          VIDEO_TITLE: ${{ inputs.title || 'Midnight Blue' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds || '30' }}
        run: python tools/cloud_studio/render_short.py

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-short-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload production manifest
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-short-manifest-${{ github.run_number }}
          path: output/production.json
          if-no-files-found: error
          retention-days: 7
