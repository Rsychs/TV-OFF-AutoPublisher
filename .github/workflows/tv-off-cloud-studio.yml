name: TV OFF Cloud Studio — room scene preview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      title:
        description: "Short title"
        required: false
        type: string
        default: "Midnight Blue"
      duration_seconds:
        description: "Preview duration"
        required: false
        type: choice
        options: ["20", "24", "30", "40", "50", "60"]
        default: "24"
      publish:
        description: "Publish after preview (leave false for review)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  render-and-publish:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 15 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'Rsychs' &&
       github.event.comment.body == '/tv-off-studio-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install room renderer and dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scipy

      - name: Render animated TV OFF room scene
        env:
          VIDEO_TITLE: ${{ inputs.title || 'Midnight Blue' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds || '24' }}
          ROOM_STYLE: midnight_blue
        run: python tools/cloud_studio/render_room_short.py

      - name: Preserve preview MP4 and scene assets
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-room-preview-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload to YouTube with shared cooldown and duplicate protection
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/cloud_studio/upload_short.py

      - name: Persist confirmed upload state
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cloud_studio_state.json
          git commit -m "Record confirmed TV OFF Cloud Studio upload"
          git pull --rebase origin main
          git push
