name: TV OFF Cloud Studio — autonomous Short

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_page_url:
        description: "Pexels source page (optional; default is the Midnight Blue rain-window clip)"
        required: false
        type: string
      title:
        description: "Short title"
        required: false
        type: string
        default: "Midnight Blue"
      duration_seconds:
        description: "Output duration"
        required: false
        type: choice
        options: ["20", "30", "40", "50", "60"]
        default: "30"

permissions:
  contents: write

concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  render-and-publish:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 15 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'Rsychs' &&
       github.event.comment.body == '/tv-off-studio')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer and YouTube dependencies
        run: python -m pip install --disable-pip-version-check numpy requests scipy google-api-python-client google-auth google-auth-httplib2

      - name: Render original TV OFF Short
        env:
          SOURCE_PAGE_URL: ${{ inputs.source_page_url || 'https://www.pexels.com/video/a-window-with-rain-falling-on-it-and-a-pillow-26586651/' }}
          VIDEO_TITLE: ${{ inputs.title || 'Midnight Blue' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds || '30' }}
        run: python tools/cloud_studio/render_short.py

      - name: Upload to YouTube with shared cooldown and duplicate protection
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/cloud_studio/upload_short.py

      - name: Persist confirmed upload state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cloud_studio_state.json
          git commit -m "Record confirmed TV OFF Cloud Studio upload"
          git pull --rebase origin main
          git push
