name: TV OFF Cloud Studio — room scene preview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      title:
        description: "Short title"
        required: false
        type: string
        default: "Midnight Blue"
      duration_seconds:
        description: "Preview duration"
        required: false
        type: choice
        options: ["20", "24", "30", "40", "50", "60"]
        default: "24"
      publish:
        description: "Publish after preview (leave false for review)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  render-and-publish:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 15 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'Rsychs' &&
       github.event.comment.body == '/tv-off-studio-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render cinematic 3D TV OFF room
        run: blender -b -t 4 -P tools/cloud_studio/render_room_blender.py

      - name: Animate the cinematic scene and add original ambient audio
        env:
          VIDEO_TITLE: ${{ inputs.title || 'Midnight Blue' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds || '24' }}
        run: |
          python -m pip install --disable-pip-version-check numpy scipy
          python - <<'PY'
          import os, numpy as np
          from scipy.io.wavfile import write
          from pathlib import Path
          d=int(os.environ.get('DURATION_SECONDS','24')); sr=48000
          t=np.arange(sr*d,dtype=np.float64)/sr
          freqs=[110.0,146.83,174.61,220.0,261.63]
          a=np.zeros_like(t)
          for i,f in enumerate(freqs): a+=(0.12/(i+1))*np.sin(2*np.pi*f*t+0.3*np.sin(2*np.pi*(0.025+i*.007)*t))
          a+=.018*np.sin(2*np.pi*55*t)
          a*=np.minimum(1,t/2)*np.minimum(1,(d-t)/2.5)
          a=a/max(np.max(np.abs(a)),1e-9)*.58
          write('output/original_ambient.wav',sr,(np.column_stack((a,np.roll(a,420)))*32767).astype(np.int16))
          Path('output/production.json').write_text('{"title":"'+os.environ.get('VIDEO_TITLE','Midnight Blue')+'","style":"Midnight Blue","scene_type":"cinematic 3D living room with television","duration_seconds":'+str(d)+',"resolution":"1080x1920","fps":30,"music":"Original synthesized ambient music","preview_only":true}',encoding='utf-8')
          PY
          ffmpeg -y -loop 1 -i output/room_scene.png -i output/original_ambient.wav -filter_complex "[0:v]zoompan=z='min(1.045,1+0.00055*on)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,eq=brightness='0.008+0.008*sin(2*PI*t/5)':eval=frame,format=yuv420p[v]" -map '[v]' -map 1:a -t "${DURATION_SECONDS:-24}" -c:v libx264 -preset veryfast -crf 19 -r 30 -c:a aac -b:a 192k -movflags +faststart output/TV_OFF_Midnight_Blue_ROOM.mp4

      - name: Preserve preview MP4 and scene assets
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-room-preview-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload to YouTube with shared cooldown and duplicate protection
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/cloud_studio/upload_short.py

      - name: Persist confirmed upload state
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cloud_studio_state.json
          git commit -m "Record confirmed TV OFF Cloud Studio upload"
          git pull --rebase origin main
          git push
