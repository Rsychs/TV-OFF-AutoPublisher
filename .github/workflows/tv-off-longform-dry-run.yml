name: TV OFF Long-form — Colab dry run

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Long-form test duration"
        required: true
        type: choice
        options: ["1", "3", "8", "10"]
        default: "1"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  longform-dry-run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 31 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'Rsychs' &&
       startsWith(github.event.comment.body, '/tv-off-longform '))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/longform-production

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate owner command and duration
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
          INPUT_HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              hours = os.environ.get("INPUT_HOURS", "1")
              if hours not in {"1","3","8","10"}:
                  raise SystemExit("Unsupported duration.")
          else:
              command = os.environ.get("COMMENT", "").splitlines()[0].strip()
              match = re.fullmatch(r"/tv-off-longform ([0-9]{8})-([0-9]{2})", command)
              if not match:
                  raise SystemExit("Command must be /tv-off-longform YYYYMMDD-HH")
              now = datetime.now(ZoneInfo("Europe/Riga"))
              expected = now.strftime("%Y%m%d-%H")
              actual = match.group(1) + "-" + match.group(2)
              if actual != expected:
                  raise SystemExit(f"Stale/future slot {actual}; current Riga hour is {expected}.")
              hours = "1"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"hours={hours}\n")
          print("Long-form dry-run request validated:", hours, "hour(s)")
          PY

      - name: Validate notebook and generator syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for path in (Path("longform/generate_sections_colab.py"), Path("longform/assemble_longform.py"), Path("longform/section_plan.py")):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          nb=json.loads(Path("longform/longform_colab_dry_run.ipynb").read_text(encoding="utf-8"))
          assert nb.get("nbformat")==4
          for i,cell in enumerate(nb.get("cells",[])):
              if cell.get("cell_type")=="code":
                  source=cell.get("source",[])
                  ast.parse("".join(source) if isinstance(source,list) else source, filename=f"notebook-cell-{i}")
          print("Long-form notebook and Python sources compile.")
          PY

      - name: Restore Colab CLI OAuth credentials
        env:
          COLAB_OAUTH_TOKEN_JSON: ${{ secrets.COLAB_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "${COLAB_OAUTH_TOKEN_JSON:-}" || { echo "Missing COLAB_OAUTH_TOKEN_JSON"; exit 1; }
          mkdir -p "$HOME/.config/colab-cli"
          printf '%s' "$COLAB_OAUTH_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
          chmod 600 "$HOME/.config/colab-cli/token.json"
          python -m pip install --disable-pip-version-check --quiet google-colab-cli keyrings.alt

      - name: Reconcile existing TV OFF Colab sessions
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            set +e
            sessions="$(timeout 30s colab --auth oauth2 sessions 2>&1)"
            rc=$?
            set -e
            echo "$sessions"
            if [ "$rc" -ne 0 ]; then
              echo "Cannot verify current Colab sessions; no allocation will occur."
              exit 1
            fi
            if ! printf '%s\n' "$sessions" | grep -Eq '(^|[^[:alnum:]_-])tv-off-(prod|unified)([^[:alnum:]_-]|$)'; then
              echo "No active TV OFF Colab session detected."
              exit 0
            fi
            echo "An existing TV OFF Colab session is active; waiting for it to close ($attempt/40)."
            sleep 30
          done
          echo "Existing TV OFF Colab session did not close; refusing overlapping GPU use."
          exit 1

      - name: Allocate the shared TV OFF Colab T4
        id: allocate
        timeout-minutes: 20
        run: colab --auth oauth2 new -s tv-off-prod --gpu T4

      - name: Execute independent multi-section ACE-Step + SDXL notebook
        timeout-minutes: 210
        run: colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f longform/longform_colab_dry_run.ipynb

      - name: Download and verify Colab dry-run package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          colab --auth oauth2 download -s tv-off-prod /content/tv_off_longform_dry_run.zip /tmp/tv_off_longform_dry_run.zip
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive=Path("/tmp/tv_off_longform_dry_run.zip")
          with zipfile.ZipFile(archive) as z:
              z.extractall("artifacts")
          root=Path("artifacts")
          sm_path=root/"sections"/"longform_sections_manifest.json"
          vm_path=root/"longform_visual_manifest.json"
          if not sm_path.is_file() or not vm_path.is_file():
              raise SystemExit("Missing long-form manifests.")
          sm=json.loads(sm_path.read_text()); vm=json.loads(vm_path.read_text())
          expected=int(${{ steps.request.outputs.hours }})
          if sm.get("target_hours")!=expected or sm.get("section_count",0)<2:
              raise SystemExit("Unexpected section target/count.")
          hashes=set(); seeds=set()
          for item in sm.get("sections",[]):
              folder=root/"sections"/item["directory"]
              m=json.loads((folder/"ace_step_smoke_result.json").read_text())
              audio=folder/m["audio_file"]
              digest=hashlib.sha256(audio.read_bytes()).hexdigest()
              if digest!=m.get("sha256") or digest in hashes or m["seed"] in seeds:
                  raise SystemExit("Duplicate or unverified ACE-Step source section.")
              hashes.add(digest); seeds.add(m["seed"])
          visual=root/vm["visual_file"]
          if (vm.get("width"),vm.get("height"))!=(1920,1080) or hashlib.sha256(visual.read_bytes()).hexdigest()!=vm.get("visual_sha256"):
              raise SystemExit("Native 16:9 SDXL visual failed verification.")
          print("COLAB LONGFORM SOURCES VERIFIED:",len(hashes),"unique sections.")
          PY

      - name: Always release and verify shared Colab T4
        if: always() && steps.allocate.outcome != 'skipped'
        run: |
          set +e
          colab --auth oauth2 stop -s tv-off-prod
          timeout 30s colab --auth oauth2 sessions
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Could not verify Colab session closure."
            exit 1
          fi
          if timeout 30s colab --auth oauth2 sessions 2>&1 | grep -Eq '(^|[^[:alnum:]_-])tv-off-prod([^[:alnum:]_-]|$)'; then
            echo "Colab T4 is still active; refusing downstream render."
            exit 1
          fi
          echo "Colab T4 release verified."

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Assemble exact-duration audio and render static 16:9 MP4
        env:
          HOURS: ${{ steps.request.outputs.hours }}
        run: |
          set -euo pipefail
          python longform/assemble_longform.py --sections-root artifacts/sections --output artifacts/TV_OFF_Longform_Master.m4a --hours "$HOURS"
          ffmpeg -y -hide_banner -loglevel error -loop 1 -framerate 1 -i "artifacts/$(python -c 'import json;print(json.load(open("artifacts/longform_visual_manifest.json"))["visual_file"])')" -i artifacts/TV_OFF_Longform_Master.m4a -map 0:v:0 -map 1:a:0 -t "$((HOURS * 3600))" -vf "scale=1920:1080,setsar=1,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 -r 1 -c:a aac -b:a 192k -movflags +faststart artifacts/TV_OFF_Longform_DryRun.mp4
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("artifacts/TV_OFF_Longform_DryRun.mp4")
          info=json.loads(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,width,height","-of","json",str(p)],check=True,capture_output=True,text=True).stdout)
          duration=float(info["format"]["duration"])
          if abs(duration-int(${{ steps.request.outputs.hours }})*3600)>1:
              raise SystemExit(f"Wrong rendered duration: {duration}")
          video=next(s for s in info["streams"] if s["codec_type"]=="video")
          if (video["width"],video["height"])!=(1920,1080):
              raise SystemExit("Rendered video is not native 1920x1080.")
          print("LONGFORM_DRY_RUN_RENDER_OK",duration,"seconds",p.stat().st_size,"bytes")
          PY

      - name: Upload long-form dry-run artifacts (no YouTube upload)
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-longform-dry-run-${{ github.run_number }}
          path: |
            artifacts/TV_OFF_Longform_DryRun.mp4
            artifacts/TV_OFF_Longform_Master.m4a
            artifacts/TV_OFF_Longform_Master.m4a.manifest.json
            artifacts/longform_visual_manifest.json
            artifacts/sections/longform_sections_manifest.json
          if-no-files-found: error
          retention-days: 14
