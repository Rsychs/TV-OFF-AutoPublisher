name: TV OFF Long-form validation

on:
  push:
    branches: [feature/longform-production]
  pull_request:
    paths:
      - "longform/**"
      - "tests/test_longform_assembler.py"
      - ".github/workflows/longform-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compile
        run: python -m py_compile longform/assemble_longform.py tests/test_longform_assembler.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_longform_assembler.py" -v
