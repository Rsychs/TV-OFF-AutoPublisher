name: TV OFF — Shorts Auto Publisher

on:
  workflow_run:
    workflows: ["TV OFF — 10-Hour Thunderstorm Video"]
    types: [completed]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-off-shorts-publisher
  cancel-in-progress: false

jobs:
  publish-short:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Select a different soundscape every two-hour slot
        run: |
          KIND=$(python -c 'from datetime import datetime, timezone; kinds=["ocean","forest","river","fireplace","rain","thunderstorm","wind"]; print(kinds[(int(datetime.now(timezone.utc).timestamp()) // 7200) % len(kinds)])')
          echo "SOUNDSCAPE=$KIND" >> "$GITHUB_ENV"
          echo "Selected soundscape: $KIND"

      - name: Download a fresh verified CC0 Freesound recording
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          USED_SOURCES_FILE: ${{ github.workspace }}/shorts_used_sources.json
        run: python download_one_audio.py

      - name: Build and publish one unique 27-second Short
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_short.py

      - name: Persist Shorts deduplication state
        if: always()
        run: |
          if [ -f shorts_state.json ] || [ -f shorts_used_sources.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f shorts_state.json shorts_used_sources.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Record TV OFF Shorts publishing state"
            fi
            git pull --rebase origin main
            git push
          fi
