name: TV OFF — Shorts Auto Publisher

on:
  workflow_run:
    workflows: ["TV OFF — 10-Hour Soundscape Video"]
    types: [completed]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-off-shorts-publisher
  cancel-in-progress: false

jobs:
  publish-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the latest main branch state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Check Shorts slot and two-hour cooldown
        id: cooldown
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("shorts_state.json")
          state = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          now = datetime.now(timezone.utc)
          slot = now.strftime("%Y%m%d%H")
          reason = ""
          if slot in state:
              reason = f"Short already published for slot {slot}: {state[slot]}"
          else:
              last = state.get("_last_published_at")
              if last:
                  elapsed = (now - datetime.fromisoformat(last)).total_seconds()
                  if elapsed < 7200:
                      reason = f"Two-hour cooldown active; {int(7200 - elapsed)} seconds remain."
          skip = "true" if reason else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={skip}\n")
          print(reason if reason else f"Short slot {slot} is ready.")
          PY

      - name: Select a different soundscape every two-hour slot
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          KIND=$(python -c 'from datetime import datetime, timezone; kinds=["ocean","forest","river","fireplace","rain","thunderstorm","wind"]; print(kinds[(int(datetime.now(timezone.utc).timestamp()) // 7200) % len(kinds)])')
          echo "SOUNDSCAPE=$KIND" >> "$GITHUB_ENV"
          echo "Selected soundscape: $KIND"

      - name: Download a fresh verified CC0 Freesound recording
        if: steps.cooldown.outputs.skip != 'true'
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          USED_SOURCES_FILE: ${{ github.workspace }}/shorts_used_sources.json
        run: python download_one_audio.py

      - name: Build and publish one unique 27-second Short
        if: steps.cooldown.outputs.skip != 'true'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_short.py

      - name: Persist Shorts deduplication state
        if: always()
        run: |
          if [ -f shorts_state.json ] || [ -f shorts_used_sources.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f shorts_state.json shorts_used_sources.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Record TV OFF Shorts publishing state"
            fi
            git pull --rebase origin main
            git push
          fi
