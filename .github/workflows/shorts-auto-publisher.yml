name: TV OFF — Shorts Auto Publisher
# Run at minute 17 each hour to avoid GitHub Actions top-of-hour congestion.

on:
  workflow_dispatch:

permissions:
  contents: write

# Share the production lock with long videos so both formats cannot select the same source concurrently.
concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  publish-short:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the latest main branch state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Enforce 60-minute cooldown without dropping the hourly slot
        id: cooldown
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("shorts_state.json")

          def load_state():
              if not path.exists():
                  return {}
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise RuntimeError("Invalid shorts_state.json; refusing to bypass slot/cooldown protection.")
              return value

          def refresh_state():
              subprocess.run(["git", "fetch", "origin", "main"], check=True)
              result = subprocess.run(
                  ["git", "show", "origin/main:shorts_state.json"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              value = json.loads(result.stdout)
              if not isinstance(value, dict):
                  raise RuntimeError("Invalid remote shorts_state.json; refusing to bypass slot/cooldown protection.")
              path.write_text(json.dumps(value, indent=2), encoding="utf-8")
              return value

          state = load_state()
          reason = ""
          while True:
              now = datetime.now(timezone.utc)
              slot = now.strftime("%Y%m%d%H")
              if slot in state:
                  reason = f"Short already published for slot {slot}: {state[slot]}"
                  break

              last_published_at = state.get("_last_published_at")
              if not last_published_at:
                  break
              try:
                  last_at = datetime.fromisoformat(str(last_published_at).replace("Z", "+00:00"))
              except ValueError as exc:
                  raise RuntimeError("Invalid _last_published_at in shorts_state.json; refusing to bypass cooldown.") from exc
              if last_at.tzinfo is None:
                  last_at = last_at.replace(tzinfo=timezone.utc)

              elapsed = (now - last_at.astimezone(timezone.utc)).total_seconds()
              if elapsed >= 3600:
                  break

              remaining = math.ceil(3600 - elapsed) + 2
              print(f"Short cooldown active: waiting {remaining}s, then rechecking the current UTC slot and remote state.")
              time.sleep(remaining)
              state = refresh_state()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if reason else 'false'}\n")
          print(reason if reason else f"Short slot {slot} is ready after the 60-minute cooldown.")
          PY

      - name: Select a different soundscape every hourly slot
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          # White and brown noise are top-tier categories (2x weight each).
          KIND=$(python -c 'from datetime import datetime, timezone; kinds=["white_noise","brown_noise","white_noise","brown_noise","ocean","white_noise","brown_noise","white_noise","forest","brown_noise","white_noise","rain"]; print(kinds[(int(datetime.now(timezone.utc).timestamp()) // 3600) % len(kinds)])')
          echo "SOUNDSCAPE=$KIND" >> "$GITHUB_ENV"
          echo "Selected soundscape: $KIND"

      - name: Generate original noise or download a fresh verified CC0 Freesound recording
        if: steps.cooldown.outputs.skip != 'true'
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          USED_SOURCES_FILE: ${{ github.workspace }}/shorts_used_sources.json
        run: python download_one_audio.py

      - name: Build and publish one unique 27-second Short
        if: steps.cooldown.outputs.skip != 'true'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_short.py

      - name: Persist Shorts deduplication state
        if: always()
        run: |
          if [ -f shorts_state.json ] || [ -f shorts_used_sources.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f shorts_state.json shorts_used_sources.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Record TV OFF Shorts publishing state"
            fi
            git pull --rebase origin main
            git push
          fi
