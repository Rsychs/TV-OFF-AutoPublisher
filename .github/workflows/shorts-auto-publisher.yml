name: TV OFF — Shorts Auto Publisher
# Event-driven only: ChatGPT tasks own the cadence; GitHub Actions executes approved requests.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  publish-short:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.issue.number == 15 &&
      github.event.comment.user.login == 'Rsychs' &&
      startsWith(github.event.comment.body, '/tv-off-short ')
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out the latest main branch state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture the exact UTC hourly slot
        id: slot
        env:
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timedelta, timezone

          comment_created_at = os.environ.get("COMMENT_CREATED_AT", "").strip()
          command_body = os.environ.get("COMMAND_BODY", "").strip()
          now = datetime.now(timezone.utc)
          if comment_created_at:
              match = re.fullmatch(r"/tv-off-short (\d{10})", command_body)
              if not match:
                  raise RuntimeError("Invalid Shorts command; refusing to run.")
              event_time = datetime.fromisoformat(comment_created_at.replace("Z", "+00:00")).astimezone(timezone.utc)
              requested_slot = event_time.strftime("%Y%m%d%H")
              if match.group(1) != requested_slot:
                  raise RuntimeError("Shorts command slot does not match its comment creation hour.")
              now = event_time
          slot_start = now.replace(minute=0, second=0, microsecond=0)
          slot_end = slot_start + timedelta(hours=1)
          target_slot = slot_start.strftime("%Y%m%d%H")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"target_slot={target_slot}\n")
              output.write(f"slot_end_epoch={int(slot_end.timestamp())}\n")
          print(f"PINNED UTC SLOT: {target_slot}; closes at {slot_end.isoformat()}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, fonts and dependencies
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Use an isolated apt source list: hosted runners may inject an Azure
          # mirror through apt-mirrors.txt, so editing ubuntu.sources alone is
          # insufficient. This bypasses that mirror selection entirely.
          if ! command -v ffmpeg >/dev/null 2>&1 || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            echo "Installing media tools from canonical Ubuntu HTTPS repositories."
            cat > "$RUNNER_TEMP/tv-off-ubuntu.sources.list" <<'EOF'
          deb https://archive.ubuntu.com/ubuntu noble main universe
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
            APT_SOURCE_OPTS=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/tv-off-ubuntu.sources.list" -o "Dir::Etc::sourceparts=-" -o "APT::Get::List-Cleanup=0")
            timeout 180s sudo apt-get "${APT_SOURCE_OPTS[@]}" update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
            timeout 180s sudo apt-get "${APT_SOURCE_OPTS[@]}" install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          command -v ffmpeg
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt

      - name: Enforce cooldown without crossing the pinned UTC slot
        id: cooldown
        env:
          TARGET_SLOT: ${{ steps.slot.outputs.target_slot }}
          SLOT_END_EPOCH: ${{ steps.slot.outputs.slot_end_epoch }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("shorts_state.json")
          target_slot = os.environ["TARGET_SLOT"]
          slot_end_epoch = int(os.environ["SLOT_END_EPOCH"])

          def refresh_state():
              subprocess.run(["git", "fetch", "origin", "main"], check=True)
              result = subprocess.run(
                  ["git", "show", "origin/main:shorts_state.json"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              value = json.loads(result.stdout)
              if not isinstance(value, dict):
                  raise RuntimeError("Invalid remote shorts_state.json; refusing to bypass slot/cooldown protection.")
              path.write_text(json.dumps(value, indent=2), encoding="utf-8")
              return value

          def cooldown_end_epoch(state):
              last_published_at = state.get("_last_published_at")
              if not last_published_at:
                  return 0.0
              try:
                  last_at = datetime.fromisoformat(str(last_published_at).replace("Z", "+00:00"))
              except ValueError as exc:
                  raise RuntimeError("Invalid _last_published_at in shorts_state.json; refusing to bypass cooldown.") from exc
              if last_at.tzinfo is None:
                  last_at = last_at.replace(tzinfo=timezone.utc)
              return last_at.astimezone(timezone.utc).timestamp() + 2400

          def runway_seconds(state):
              try:
                  last_duration = int(state.get("_last_production_duration_seconds", 553))
              except (TypeError, ValueError) as exc:
                  raise RuntimeError("Invalid _last_production_duration_seconds; refusing to bypass slot runway guard.") from exc
              if last_duration < 0:
                  raise RuntimeError("Negative _last_production_duration_seconds; refusing to bypass slot runway guard.")
              return max(180, last_duration + 180), last_duration

          state = refresh_state()
          reason = ""
          production_started_epoch = 0

          while True:
              now = datetime.now(timezone.utc)
              current_slot = now.strftime("%Y%m%d%H")
              if current_slot != target_slot:
                  reason = (
                      f"UTC slot {target_slot} closed while waiting; current slot is {current_slot}. "
                      "Refusing to roll over to a later slot."
                  )
                  break

              if target_slot in state:
                  reason = f"Short already published for pinned slot {target_slot}: {state[target_slot]}"
                  break

              cooldown_end = cooldown_end_epoch(state)
              earliest_start = max(now.timestamp(), cooldown_end)
              required_runway, last_duration = runway_seconds(state)
              runway_after_earliest_start = slot_end_epoch - earliest_start
              if runway_after_earliest_start < required_runway:
                  reason = (
                      f"Insufficient runway for pinned slot {target_slot}: "
                      f"{max(0, int(runway_after_earliest_start))}s remain after cooldown, "
                      f"{required_runway}s required (last production {last_duration}s + 180s reserve)."
                  )
                  break

              if now.timestamp() < cooldown_end:
                  remaining = math.ceil(cooldown_end - now.timestamp()) + 2
                  print(
                      f"Short cooldown active: waiting {min(60, remaining)}s; "
                      f"earliest_start={datetime.fromtimestamp(earliest_start, timezone.utc).isoformat()}; "
                      f"required_runway={required_runway}s; rechecking pinned slot {target_slot} and remote state."
                  )
                  time.sleep(min(60, max(1, remaining)))
                  state = refresh_state()
                  continue

              remaining_in_slot = slot_end_epoch - now.timestamp()
              if remaining_in_slot < required_runway:
                  reason = (
                      f"Insufficient runway for pinned slot {target_slot}: "
                      f"{max(0, int(remaining_in_slot))}s remain, "
                      f"{required_runway}s required (last production {last_duration}s + 180s reserve)."
                  )
                  break

              production_started_epoch = int(now.timestamp())
              break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if reason else 'false'}\n")
              output.write(f"target_slot={target_slot}\n")
              if production_started_epoch:
                  output.write(f"production_started_epoch={production_started_epoch}\n")
          print(reason if reason else f"UTC slot {target_slot} is ready; cooldown and runway guards passed.")
          PY

      - name: Select soundscape for the pinned UTC slot
        id: select_soundscape
        if: steps.cooldown.outputs.skip != 'true'
        env:
          TARGET_SLOT: ${{ steps.slot.outputs.target_slot }}
        run: |
          KIND=$(python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          target_slot = os.environ["TARGET_SLOT"]
          slot_start = datetime.strptime(target_slot, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          slot_hour = int(slot_start.timestamp() // 3600)
          state = json.loads(open("state.json", encoding="utf-8").read())
          import re
          def confirmed(category):
              needle = category.replace("_", "")
              return any(
                  isinstance(key, str)
                  and needle in re.sub(r"[^a-z0-9]", "", key.lower())
                  and isinstance(value, str)
                  and re.fullmatch(r"[A-Za-z0-9_-]{11}", value.strip())
                  for key, value in state.items()
              )

          if not confirmed("brown_noise"):
              kind = "brown_noise"
          elif not confirmed("white_noise"):
              kind = "white_noise"
          else:
              # Three permitted categories only; nature and field recordings are retired.
              kinds = ["white_noise", "brown_noise", "original_music",
                       "brown_noise", "white_noise", "original_music"]
              kind = kinds[slot_hour % len(kinds)]
          print(kind)
          PY
          )
          echo "SOUNDSCAPE=$KIND" >> "$GITHUB_ENV"
          echo "TARGET_SLOT=$TARGET_SLOT" >> "$GITHUB_ENV"
          echo "soundscape=$KIND" >> "$GITHUB_OUTPUT"
          echo "Selected soundscape for pinned slot $TARGET_SLOT: $KIND"

      - name: Generate original ambient music locally
        if: steps.cooldown.outputs.skip != 'true' && steps.select_soundscape.outputs.soundscape == 'original_music'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
        run: python generate_original_music.py

      - name: Generate original white or brown noise locally
        if: steps.cooldown.outputs.skip != 'true' && steps.select_soundscape.outputs.soundscape != 'original_music'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
        run: python download_one_audio.py

      - name: Build and publish one unique 18-second Short
        if: steps.cooldown.outputs.skip != 'true'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          TARGET_SLOT: ${{ steps.slot.outputs.target_slot }}
          PRODUCTION_STARTED_EPOCH: ${{ steps.cooldown.outputs.production_started_epoch }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_short.py

      - name: Persist Shorts deduplication state
        if: always()
        run: |
          if [ -f shorts_state.json ] || [ -f shorts_used_sources.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f shorts_state.json shorts_used_sources.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Record TV OFF Shorts publishing state"
            fi
            git pull --rebase origin main
            git push
          fi
