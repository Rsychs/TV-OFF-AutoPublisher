name: YouTube AutoPublisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "generate_fireplace.py"
      - "generate_thumbnails.py"
      - "validate_media.py"
      - "schedule.csv"
      - "uploader.py"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt numpy pillow

      - name: Generate scheduled video assets
        run: |
          python generate_fireplace.py
          python generate_thumbnails.py

      - name: Validate generated video and audio before upload
        run: |
          if [ -f "videos/TV-OFF_Fireplace_1-Hour.mp4" ]; then
            python validate_media.py "videos/TV-OFF_Fireplace_1-Hour.mp4"
          fi

      - name: Upload videos and set custom thumbnails
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_DIR: ${{ github.workspace }}/videos
        run: python uploader.py

      - name: Save upload state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update upload state"
          git push
