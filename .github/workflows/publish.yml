name: YouTube AutoPublisher

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube credentials
        env:
          YT_CLIENT_JSON: ${{ secrets.YT_CLIENT_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("client_secret.json").write_text(os.environ["YT_CLIENT_JSON"])
          Path("token.json").write_text(os.environ["YT_TOKEN_JSON"])
          PY

      - name: Upload scheduled videos
        run: python uploader.py

      - name: Save upload state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update upload state"
          git push
