name: TV OFF Unified ACE-Step + SDXL — production publish
on:
  schedule:
    - cron: '0 * * * *'
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  production-publish:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 30 &&
       github.event.issue.title == 'TV OFF Colab Unified Dry Run' &&
       github.event.comment.body == '/publish-colab-unified' &&
       github.event.comment.user.login == 'Rsychs') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.title == 'TV OFF Unified SDXL Dry Run' &&
       github.event.comment.body == '/publish-unified-sdxl' &&
       github.event.comment.user.login == 'Rsychs')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/colab-cli-gpu-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unified ACE-Step + SDXL notebook source and syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json
          from pathlib import Path
          path = Path("kaggle/tv-off-prod/tv_off_unified.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          if notebook.get("nbformat") != 4:
              raise SystemExit("Unified notebook must use nbformat 4")
          checked = 0
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              source_text = "".join(source) if isinstance(source, list) else source
              if not isinstance(source_text, str):
                  raise SystemExit(f"Notebook cell {index} has invalid source")
              ast.parse(source_text, filename=f"{path}:cell-{index}")
              checked += 1
          if checked < 2:
              raise SystemExit("Expected ACE-Step and SDXL executable notebook cells")
          print(f"Validated Python syntax in {checked} notebook cells.")
          PY
      - name: Restore Colab CLI OAuth credentials
        if: always()
        env:
          COLAB_OAUTH_TOKEN_JSON: ${{ secrets.COLAB_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "${COLAB_OAUTH_TOKEN_JSON:-}" || { echo "Missing COLAB_OAUTH_TOKEN_JSON"; exit 1; }
          mkdir -p "$HOME/.config/colab-cli"
          printf '%s' "$COLAB_OAUTH_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
          chmod 600 "$HOME/.config/colab-cli/token.json"
          python -m pip install --disable-pip-version-check --quiet google-colab-cli keyrings.alt
      - name: Reserve UTC slot and enforce shared cooldown
        id: reserve-slot
        env:
          DROPBOX_MUSIC_APP_KEY: ${{ secrets.DROPBOX_MUSIC_APP_KEY }}
          DROPBOX_MUSIC_APP_SECRET: ${{ secrets.DROPBOX_MUSIC_APP_SECRET }}
          DROPBOX_MUSIC_REFRESH_TOKEN: ${{ secrets.DROPBOX_MUSIC_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          required = ["DROPBOX_MUSIC_APP_KEY", "DROPBOX_MUSIC_APP_SECRET", "DROPBOX_MUSIC_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing Dropbox state-reservation secrets: " + ", ".join(missing))

          local_path = Path("music_shorts_state.json")
          local = json.loads(local_path.read_text(encoding="utf-8")) if local_path.is_file() else {}
          if not isinstance(local, dict):
              raise SystemExit("Repository publication state is not a JSON object")

          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["DROPBOX_MUSIC_REFRESH_TOKEN"]},
              auth=(os.environ["DROPBOX_MUSIC_APP_KEY"], os.environ["DROPBOX_MUSIC_APP_SECRET"]),
              timeout=30,
          )
          token_response.raise_for_status()
          token = token_response.json()["access_token"]
          state_path = "/music_shorts_state.json"
          remote_response = requests.post(
              "https://content.dropboxapi.com/2/files/download",
              headers={"Authorization": f"Bearer {token}", "Dropbox-API-Arg": json.dumps({"path": state_path})},
              timeout=30,
          )
          if remote_response.status_code == 200:
              remote = json.loads(remote_response.content.decode("utf-8"))
              if not isinstance(remote, dict):
                  raise SystemExit("Dropbox publication state is not a JSON object")
          elif remote_response.status_code == 409 and "path/not_found" in remote_response.text:
              remote = {}
              print("Dropbox state file does not exist yet; seeding it from the repository.")
          else:
              raise SystemExit(
                  f"Cannot restore Dropbox publication state: "
                  f"{remote_response.status_code} {remote_response.text}"
              )

          state = dict(remote)
          for key in (
              "_published_audio_sha256",
              "_published_video_sha256",
              "_published_full_video_sha256",
              "_processed_utc_slots",
          ):
              merged = []
              for source in (remote, local):
                  values = source.get(key, [])
                  if not isinstance(values, list):
                      raise SystemExit(f"Publication state field {key} is not a list")
                  for value in values:
                      if value and value not in merged:
                          merged.append(value)
              state[key] = merged[-500:]

          tracks = {}
          for source in (remote, local):
              records = source.get("published_tracks", [])
              if not isinstance(records, list):
                  raise SystemExit("published_tracks is not a list")
              for record in records:
                  if not isinstance(record, dict):
                      continue
                  key = record.get("audio_sha256") or record.get("short_video_id") or record.get("video_id")
                  if key:
                      tracks[key] = record

          historical_records = [
              {
                  "short_video_id": "A9OHx8aAq8M",
                  "short_url": "https://youtu.be/A9OHx8aAq8M",
                  "full_video_id": "pH1BCfgtHus",
                  "full_url": "https://youtu.be/pH1BCfgtHus",
                  "track_title": "Midnight Pavilion 61221 — Korean Gugak",
                  "style": "Instrumental Korean gugak chamber / courtly jeongak ensemble with pentatonic ujo melody and heterophonic acoustic instrumentation",
                  "audio_sha256": "46f0aa095617fce86095e756972f9d107f8e55e7cd22f8bd83e32e3a1c5e3b9e",
                  "short_video_sha256": "73559691d4c519af01f0648eac0b81db2b0edd8279a65ac7ed70655c2a45ad08",
                  "full_video_sha256": "6a5b07b2d1dafd64f597825d9e06f573c592afe56e284d9abde0c762bcb5fd87",
                  "visual_sha256": "8f9decc59234d17b5cc3bf3a36811113133f926ceab1ed4626e47f506245e090",
                  "duration_seconds": 174.0,
                  "short_published_at": "2026-11-21T13:57:28.751622+00:00",
                  "full_published_at": "2026-11-21T13:57:28.751651+00:00",
                  "full_upload_status": "published",
              },
              {
                  "short_video_id": "0DibjqE_k3Q",
                  "short_url": "https://youtu.be/0DibjqE_k3Q",
                  "full_video_id": "hTiUvLQxXZo",
                  "full_url": "https://youtu.be/hTiUvLQxXZo",
                  "track_title": "Neon Afterglow 83184",
                  "style": "Electro Instrumental",
                  "audio_sha256": "b0e94f4f9217d2470820897de9a92a4e7b086bc768c6017baa73fd94ded8d1d7",
                  "short_video_sha256": "0a26bda28d055c160f35d77cc21f844d9c5ff5bb9e7c127573b8420288db06f5",
                  "full_video_sha256": "6e823d6a8e6313aeec9d906870deec9bfc0587572c3fa7ea961eb5dfce2da1ae",
                  "visual_sha256": "610740b036682f934b9561a8e0529641f7bcad2f4165a95a7643b6be3fcd2af1",
                  "duration_seconds": 174.0,
                  "short_published_at": "2026-11-21T14:41:07.830759+00:00",
                  "full_published_at": "2026-11-21T14:41:07.831006+00:00",
                  "full_upload_status": "published",
              },
          ]
          for historical in historical_records:
              tracks.setdefault(historical["audio_sha256"], historical)
              for key, value in (
                  ("_published_audio_sha256", historical["audio_sha256"]),
                  ("_published_video_sha256", historical["short_video_sha256"]),
                  ("_published_full_video_sha256", historical["full_video_sha256"]),
              ):
                  if value and value not in state[key]:
                      state[key].append(value)
                      state[key] = state[key][-500:]
          state["published_tracks"] = list(tracks.values())[-500:]

          published_times = []
          for source in (remote, local):
              value = source.get("_last_published_at")
              if value:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  published_times.append(dt.astimezone(timezone.utc))
          for historical in historical_records:
              published_times.append(datetime.fromisoformat(historical["short_published_at"]).astimezone(timezone.utc))
          if published_times:
              state["_last_published_at"] = max(published_times).isoformat()

          now = datetime.now(timezone.utc)
          slot = now.replace(minute=0, second=0, microsecond=0).strftime("%Y-%m-%dT%H:00:00Z")
          processed = state.get("_processed_utc_slots", [])
          if slot in processed:
              skip_reason = "utc_slot_already_processed"
          else:
              skip_reason = ""

          pending_pairs = [
              item for item in state["published_tracks"]
              if item.get("short_video_id") and item.get("full_upload_status") != "published"
          ]
          if pending_pairs and not skip_reason:
              skip_reason = "previous_short_has_no_confirmed_full_track"

          last = state.get("_last_published_at")
          if last and not skip_reason:
              last_dt = datetime.fromisoformat(str(last).replace("Z", "+00:00"))
              if last_dt.tzinfo is None:
                  last_dt = last_dt.replace(tzinfo=timezone.utc)
              remaining = 3600 - (now - last_dt.astimezone(timezone.utc)).total_seconds()
              if remaining > 0:
                  skip_reason = f"cooldown_active_{int(remaining)}s"

          if slot not in processed:
              processed.append(slot)
          state["_processed_utc_slots"] = processed[-500:]
          state_bytes = json.dumps(state, indent=2, ensure_ascii=False).encode("utf-8")
          upload = requests.post(
              "https://content.dropboxapi.com/2/files/upload",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/octet-stream",
                  "Dropbox-API-Arg": json.dumps({
                      "path": state_path, "mode": "overwrite", "autorename": False,
                      "mute": True, "strict_conflict": True
                  }, separators=(",", ":")),
              },
              data=state_bytes,
              timeout=60,
          )
          upload.raise_for_status()
          downloaded = requests.post(
              "https://content.dropboxapi.com/2/files/download",
              headers={"Authorization": f"Bearer {token}", "Dropbox-API-Arg": json.dumps({"path": state_path})},
              timeout=30,
          )
          downloaded.raise_for_status()
          digest = hashlib.sha256(state_bytes).hexdigest()
          if hashlib.sha256(downloaded.content).hexdigest() != digest:
              raise SystemExit("UTC slot reservation read-back SHA-256 mismatch")
          local_path.write_bytes(state_bytes)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("state_reserved=true\n")
              output.write(f"should_run={'false' if skip_reason else 'true'}\n")
              output.write(f"skip_reason={skip_reason or 'none'}\n")

          print("UTC slot reservation saved and read-back verified:", slot)
          print("Last confirmed publication:", state.get("_last_published_at", "none"))
          print("Processed UTC slots retained:", len(state["_processed_utc_slots"]))
          if skip_reason:
              print("Production generation safely skipped:", skip_reason)
          else:
              print("Production slot reserved; unified ACE-Step + SDXL may proceed.")
          PY

      - name: Prepare Colab-compatible unified notebook
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("kaggle/tv-off-prod/tv_off_unified.ipynb")
          nb = json.loads(src.read_text(encoding="utf-8"))
          for cell in nb.get("cells", []):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              if isinstance(source, list):
                  source = "".join(source)
              if not isinstance(source, str):
                  raise SystemExit("Notebook code cell source must be text.")
              source = source.replace("/kaggle/working", "/content")
              cell["source"] = source
              cell["outputs"] = []
              cell["execution_count"] = None
          out = Path("/tmp/tv_off_colab_unified.ipynb")
          out.write_text(json.dumps(nb, ensure_ascii=False), encoding="utf-8")
          print("Prepared", out, "cells=", len(nb.get("cells", [])))
          PY
      - name: Allocate Colab T4
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: colab --auth oauth2 new -s tv-off-prod --gpu T4
      - name: Execute unified ACE-Step + SDXL on Colab
        if: steps.reserve-slot.outputs.should_run == 'true'
        timeout-minutes: 210
        run: colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f /tmp/tv_off_colab_unified.ipynb
      - name: Package and verify generated assets on Colab
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f tools/colab_package_output.py
      - name: Download and verify Colab production assets
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          colab --auth oauth2 download -s tv-off-prod /content/tv_off_colab_dry_run.zip /tmp/tv_off_colab_production.zip
          python - <<'PY'
          import zipfile, json, hashlib
          from pathlib import Path
          archive = Path("/tmp/tv_off_colab_production.zip")
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              required = {"ace_step_smoke_result.json"}
              if not required.issubset(names):
                  raise SystemExit("Colab archive missing production manifest")
              z.extractall("kaggle-output")
          root = Path("kaggle-output")
          m = json.loads((root / "ace_step_smoke_result.json").read_text())
          if m.get("status") != "ok" or m.get("publishing_enabled") is not True:
              raise SystemExit("Colab manifest is not approved for production")
          for key, hash_key in [("audio_file","sha256"),("visual_file","visual_sha256"),("landscape_file","landscape_sha256")]:
              p = root / m[key]
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != m.get(hash_key):
                  raise SystemExit(f"Colab asset failed SHA-256 validation: {key}")
          print("COLAB PRODUCTION ASSETS VERIFIED:", m["title"], m["style"], m["duration_seconds"], "seconds")
          PY
      - name: Always release Colab T4
        if: always() && steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set +e
          colab --auth oauth2 stop -s tv-off-prod
          exit 0
      - name: Save completed original song to Dropbox
        if: steps.reserve-slot.outputs.should_run == 'true'
        id: dropbox-save
        env:
          DROPBOX_MUSIC_APP_KEY: ${{ secrets.DROPBOX_MUSIC_APP_KEY }}
          DROPBOX_MUSIC_APP_SECRET: ${{ secrets.DROPBOX_MUSIC_APP_SECRET }}
          DROPBOX_MUSIC_REFRESH_TOKEN: ${{ secrets.DROPBOX_MUSIC_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import requests

          required = ["DROPBOX_MUSIC_APP_KEY", "DROPBOX_MUSIC_APP_SECRET", "DROPBOX_MUSIC_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing Dropbox Music secrets: " + ", ".join(missing))
          root = Path("kaggle-output")
          manifests = list(root.rglob("ace_step_smoke_result.json"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected one generation manifest, found {len(manifests)}")
          manifest_path = manifests[0]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "ok" or manifest.get("publishing_enabled") is not True:
              raise SystemExit("Refusing to save an unverified or non-production track")
          title = str(manifest.get("title", "")).strip()
          if not title or any(ch.isdigit() for ch in title):
              raise SystemExit("Public track title must be non-empty and contain no digits")
          audio_files = [manifest.get("audio_file"), manifest.get("mp3_file")]
          audio_files = [name for name in audio_files if name]
          if not audio_files:
              raise SystemExit("Manifest contains no audio files")
          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["DROPBOX_MUSIC_REFRESH_TOKEN"]},
              auth=(os.environ["DROPBOX_MUSIC_APP_KEY"], os.environ["DROPBOX_MUSIC_APP_SECRET"]),
              timeout=30,
          )
          token_response.raise_for_status()
          access_token = token_response.json()["access_token"]

          state_path = Path("music_shorts_state.json")
          local_state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          if not isinstance(local_state, dict):
              raise SystemExit("Checked-in music_shorts_state.json is invalid")
          state_download = requests.post(
              "https://content.dropboxapi.com/2/files/download",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Dropbox-API-Arg": json.dumps({"path": "/music_shorts_state.json"}),
              },
              timeout=30,
          )
          remote_state = {}
          if state_download.status_code == 200:
              remote_state = json.loads(state_download.content.decode("utf-8"))
              if not isinstance(remote_state, dict):
                  raise SystemExit("Persisted Dropbox publication state is not a JSON object")
          elif state_download.status_code == 409 and "path/not_found" in state_download.text:
              print("No persisted Dropbox publication state yet; using repository seed.")
          else:
              raise SystemExit(
                  f"Could not restore Dropbox publication state: "
                  f"{state_download.status_code} {state_download.text}"
              )

          merged_state = dict(remote_state)
          for key in ("_published_audio_sha256", "_published_video_sha256", "_published_full_video_sha256"):
              merged = []
              for value in list(remote_state.get(key, [])) + list(local_state.get(key, [])):
                  if value and value not in merged:
                      merged.append(value)
              merged_state[key] = merged[-500:]

          tracks_by_key = {}
          for track in list(remote_state.get("published_tracks", [])) + list(local_state.get("published_tracks", [])):
              if not isinstance(track, dict):
                  continue
              track_key = track.get("audio_sha256") or track.get("short_video_id") or track.get("video_id")
              if track_key:
                  tracks_by_key[track_key] = track

          # Backfill the last verified pair published before Dropbox state persistence existed.
          historical = {
              "short_video_id": "0DibjqE_k3Q",
              "short_url": "https://youtu.be/0DibjqE_k3Q",
              "full_video_id": "hTiUvLQxXZo",
              "full_url": "https://youtu.be/hTiUvLQxXZo",
              "track_title": "Neon Afterglow 83184",
              "style": "Electro Instrumental",
              "audio_sha256": "b0e94f4f9217d2470820897de9a92a4e7b086bc768c6017baa73fd94ded8d1d7",
              "short_video_sha256": "0a26bda28d055c160f35d77cc21f844d9c5ff5bb9e7c127573b8420288db06f5",
              "full_video_sha256": "6e823d6a8e6313aeec9d906870deec9bfc0587572c3fa7ea961eb5dfce2da1ae",
              "visual_sha256": "610740b036682f934b9561a8e0529641f7bcad2f4165a95a7643b6be3fcd2af1",
              "duration_seconds": 174.0,
              "short_published_at": "2026-11-21T14:41:07.830759+00:00",
              "full_published_at": "2026-11-21T14:41:07.831006+00:00",
              "full_upload_status": "published",
          }
          tracks_by_key.setdefault(historical["audio_sha256"], historical)
          merged_state["published_tracks"] = list(tracks_by_key.values())[-500:]
          for key, value in (
              ("_published_audio_sha256", historical["audio_sha256"]),
              ("_published_video_sha256", historical["short_video_sha256"]),
              ("_published_full_video_sha256", historical["full_video_sha256"]),
          ):
              if value not in merged_state[key]:
                  merged_state[key].append(value)
                  merged_state[key] = merged_state[key][-500:]

          from datetime import datetime, timezone
          timestamps = [
              merged_state.get("_last_published_at"),
              local_state.get("_last_published_at"),
              historical["short_published_at"],
          ]
          parsed = []
          for value in timestamps:
              if not value:
                  continue
              dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              parsed.append(dt.astimezone(timezone.utc))
          if parsed:
              merged_state["_last_published_at"] = max(parsed).isoformat()
          state_path.write_text(json.dumps(merged_state, indent=2, ensure_ascii=False), encoding="utf-8")
          Path(".tv_off_state_synced").write_text("ok", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("state_synced=true\n")
          print(
              "RESTORED AND MERGED PUBLICATION STATE:",
              f"{len(merged_state.get('_published_audio_sha256', []))} audio hashes,",
              f"{len(merged_state.get('published_tracks', []))} track records;",
              "last publish", merged_state.get("_last_published_at"),
          )
          destination_dir = "/TV OFF/Music Library/Original Tracks/Approved"
          folder_check = requests.post(
              "https://api.dropboxapi.com/2/files/get_metadata",
              headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
              json={"path": destination_dir},
              timeout=30,
          )
          if not folder_check.ok:
              raise SystemExit(
                  f"Dropbox production destination is not accessible: "
                  f"{destination_dir} ({folder_check.status_code} {folder_check.text})"
              )
          if folder_check.json().get(".tag") != "folder":
              raise SystemExit(f"Dropbox production destination is not a folder: {destination_dir}")

          saved = []
          for name in audio_files + [manifest_path.name]:
              local = (manifest_path.parent / name).resolve()
              if not local.is_relative_to(root.resolve()) or not local.is_file():
                  raise SystemExit(f"Missing or unsafe production file: {name}")
              digest = hashlib.sha256(local.read_bytes()).hexdigest()
              if name == manifest.get("audio_file") and digest != manifest.get("sha256"):
                  raise SystemExit("WAV SHA-256 does not match generation manifest")
              target = destination_dir + "/" + local.name
              headers = {
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": "application/octet-stream",
                  "Dropbox-API-Arg": json.dumps({
                      "path": target, "mode": "add", "autorename": False,
                      "mute": True, "strict_conflict": True
                  }, separators=(",", ":")),
              }
              with local.open("rb") as stream:
                  response = requests.post(
                      "https://content.dropboxapi.com/2/files/upload",
                      headers=headers, data=stream, timeout=600
                  )
              if not response.ok:
                  raise SystemExit(f"Dropbox upload failed for {name}: {response.status_code} {response.text}")
              result = response.json()
              if result.get("path_display") != target or result.get("size") != local.stat().st_size:
                  raise SystemExit(f"Dropbox metadata mismatch for {name}")
              verify = requests.post(
                  "https://api.dropboxapi.com/2/files/get_metadata",
                  headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
                  json={"path": target}, timeout=30
              )
              if not verify.ok or verify.json().get("size") != local.stat().st_size:
                  raise SystemExit(f"Dropbox verification failed for {name}")
              saved.append(target)
          print("DROPBOX SONG SAVE VERIFIED:")
          for path in saved:
              print(path)
          PY
      - name: Install render dependencies
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Build and publish Short + complete original track
        if: steps.reserve-slot.outputs.should_run == 'true'
        env:
          PUBLISH_MODE: publish
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_music_short.py

      - name: Persist publication state to Dropbox
        if: always() && steps.dropbox-save.outputs.state_synced == 'true'
        env:
          DROPBOX_MUSIC_APP_KEY: ${{ secrets.DROPBOX_MUSIC_APP_KEY }}
          DROPBOX_MUSIC_APP_SECRET: ${{ secrets.DROPBOX_MUSIC_APP_SECRET }}
          DROPBOX_MUSIC_REFRESH_TOKEN: ${{ secrets.DROPBOX_MUSIC_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -f .tv_off_state_synced || {
            echo "Dropbox state restore output was set but its marker is missing."
            exit 1
          }
          python -m pip install --quiet requests
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import requests

          required = ["DROPBOX_MUSIC_APP_KEY", "DROPBOX_MUSIC_APP_SECRET", "DROPBOX_MUSIC_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing Dropbox Music secrets: " + ", ".join(missing))
          state_path = Path("music_shorts_state.json")
          if not state_path.is_file():
              raise SystemExit("Publication state file is missing; refusing to claim persistence")
          data = state_path.read_bytes()
          state = json.loads(data.decode("utf-8"))
          if not isinstance(state, dict):
              raise SystemExit("Publication state is not a JSON object")
          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["DROPBOX_MUSIC_REFRESH_TOKEN"]},
              auth=(os.environ["DROPBOX_MUSIC_APP_KEY"], os.environ["DROPBOX_MUSIC_APP_SECRET"]),
              timeout=30,
          )
          token_response.raise_for_status()
          access_token = token_response.json()["access_token"]
          upload = requests.post(
              "https://content.dropboxapi.com/2/files/upload",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": "application/octet-stream",
                  "Dropbox-API-Arg": json.dumps({
                      "path": "/music_shorts_state.json",
                      "mode": "overwrite",
                      "autorename": False,
                      "mute": True,
                  }, separators=(",", ":")),
              },
              data=data,
              timeout=60,
          )
          upload.raise_for_status()
          downloaded = requests.post(
              "https://content.dropboxapi.com/2/files/download",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Dropbox-API-Arg": json.dumps({"path": "/music_shorts_state.json"}),
              },
              timeout=30,
          )
          downloaded.raise_for_status()
          if hashlib.sha256(downloaded.content).hexdigest() != hashlib.sha256(data).hexdigest():
              raise SystemExit("Dropbox publication state read-back SHA-256 mismatch")
          print(
              "DROPBOX PUBLICATION STATE PERSISTED AND VERIFIED:",
              upload.json().get("path_display", "/music_shorts_state.json"),
              "bytes=", len(data),
              "sha256=", hashlib.sha256(data).hexdigest(),
          )
          PY

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-prod-sdxl-production
          path: |
            kaggle-output/
            music-shorts/
            music_shorts_state.json
          if-no-files-found: warn
          retention-days: 7
