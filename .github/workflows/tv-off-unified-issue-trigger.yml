name: TV OFF Unified ACE-Step + SDXL — production publish
on:
  schedule:
    - cron: '20,40 * * * *'
  workflow_dispatch:
    inputs:
      launch_reason:
        description: 'Reason for an owner-requested production run'
        required: false
        default: 'manual production launch'
        type: string
  issue_comment:
    types: [created, edited]
permissions:
  contents: write
  actions: read
jobs:
  production-publish:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 15 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'Rsychs' &&
       startsWith(github.event.comment.body, '/tv-off-music '))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/colab-cli-gpu-worker
      - name: Validate owner-issued TV OFF music command
        if: github.event_name == 'issue_comment'
        env:
          TV_OFF_ISSUE_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          command = os.environ.get("TV_OFF_ISSUE_COMMAND", "").splitlines()[0].strip()
          match = re.fullmatch(r"/tv-off-music ([0-9]{8})-([0-9]{2})", command)
          if not match:
              raise SystemExit("Issue command must exactly match /tv-off-music YYYYMMDD-HH.")
          now = datetime.now(ZoneInfo("Europe/Riga"))
          expected = now.strftime("%Y%m%d-") + f"{(now.hour // 3) * 3:02d}"
          actual = match.group(1) + "-" + match.group(2)
          if actual != expected:
              raise SystemExit(f"Issue command slot {actual} is stale or future; current Riga slot is {expected}.")
          print("Owner-authorized TV OFF music command validated for", expected)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unified ACE-Step + SDXL notebook source and syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json
          from pathlib import Path
          path = Path("colab/tv-off-unified/tv_off_unified.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          if notebook.get("nbformat") != 4:
              raise SystemExit("Unified notebook must use nbformat 4")
          for source_path in (
              Path("build_and_upload_music_short.py"),
              Path("scripts/render_tv_off_short_scene.py"),
              Path("tools/colab_package_output.py"),
          ):
              ast.parse(source_path.read_text(encoding="utf-8"), filename=str(source_path))
          print("Validated publisher, Blender renderer, and Colab packaging Python syntax.")
          checked = 0
          has_executable_sdxl = False
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              source_text = "".join(source) if isinstance(source, list) else source
              if not isinstance(source_text, str):
                  raise SystemExit(f"Notebook cell {index} has invalid source")
              tree = ast.parse(source_text, filename=f"{path}:cell-{index}")
              if (
                  "AutoPipelineForText2Image" in source_text
                  and "visual_file" in source_text
                  and "landscape_file" in source_text
                  and len(tree.body) >= 10
              ):
                  has_executable_sdxl = True
              checked += 1
          if checked < 2:
              raise SystemExit("Expected ACE-Step and SDXL executable notebook cells")
          if not has_executable_sdxl:
              raise SystemExit("SDXL cell is missing executable visual-generation code; comment-only cells are rejected")
          print(f"Validated Python syntax in {checked} notebook cells, including executable SDXL generation.")
          PY
      - name: Restore Colab CLI OAuth credentials
        if: always()
        env:
          COLAB_OAUTH_TOKEN_JSON: ${{ secrets.COLAB_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "${COLAB_OAUTH_TOKEN_JSON:-}" || { echo "Missing COLAB_OAUTH_TOKEN_JSON"; exit 1; }
          mkdir -p "$HOME/.config/colab-cli"
          printf '%s' "$COLAB_OAUTH_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
          chmod 600 "$HOME/.config/colab-cli/token.json"
          python -m pip install --disable-pip-version-check --quiet google-colab-cli keyrings.alt
      - name: Verify YouTube upload OAuth scope before Colab (retry transient failures)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests
          python - <<'PY'
          import os, time, requests
          required = ("YT_CLIENT_ID", "YT_CLIENT_SECRET", "YT_REFRESH_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing YouTube upload secrets: " + ", ".join(missing))
          payload = {
              "client_id": os.environ["YT_CLIENT_ID"],
              "client_secret": os.environ["YT_CLIENT_SECRET"],
              "refresh_token": os.environ["YT_REFRESH_TOKEN"],
              "grant_type": "refresh_token",
          }
          response = None
          for attempt in range(1, 4):
              try:
                  response = requests.post("https://oauth2.googleapis.com/token", data=payload, timeout=30)
              except requests.RequestException as exc:
                  if attempt == 3:
                      raise SystemExit(f"YouTube OAuth endpoint unavailable after 3 attempts: {exc}")
                  time.sleep(attempt * 10)
                  continue
              if response.ok:
                  break
              try:
                  detail = response.json()
              except ValueError:
                  detail = {}
              error = detail.get("error", "unknown")
              description = detail.get("error_description", "")
              if response.status_code == 429 or response.status_code >= 500:
                  if attempt < 3:
                      print(f"Transient YouTube OAuth response HTTP {response.status_code}; retrying.")
                      time.sleep(attempt * 15)
                      continue
              print("YouTube OAuth refresh rejected:", response.status_code, error, description)
              raise SystemExit("YouTube upload OAuth must be re-authorized before Colab allocation.")
          if response is None or not response.ok:
              raise SystemExit("YouTube upload OAuth could not be verified.")
          access_token = response.json().get("access_token")
          if not access_token:
              raise SystemExit("YouTube OAuth refresh returned no access token.")
          info = requests.get("https://oauth2.googleapis.com/tokeninfo", params={"access_token": access_token}, timeout=30)
          if not info.ok:
              raise SystemExit(f"YouTube token scope inspection failed: HTTP {info.status_code}")
          scopes = set(info.json().get("scope", "").split())
          required_scope = "https://www.googleapis.com/auth/youtube.upload"
          if required_scope not in scopes:
              raise SystemExit("YouTube OAuth token lacks the youtube.upload scope.")
          print("YouTube upload OAuth verified; required scope is present.")
          PY
      - name: Wait for previous Colab session to close; refuse overlap
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess, time
          names = ("tv-off-prod", "tv-off-unified")
          pattern = re.compile(r"(?<![A-Za-z0-9_-])(?:" + "|".join(map(re.escape, names)) + r")(?![A-Za-z0-9_-])")
          for attempt in range(1, 41):
              try:
                  result = subprocess.run(
                      ["colab", "--auth", "oauth2", "sessions"],
                      capture_output=True, text=True, timeout=30,
                  )
              except subprocess.TimeoutExpired:
                  print(f"Colab sessions query timed out ({attempt}/40); retrying safely.", flush=True)
                  time.sleep(30)
                  continue
              output = result.stdout + "\n" + result.stderr
              print(output, flush=True)
              if result.returncode != 0:
                  print(f"Colab sessions query failed ({attempt}/40); no GPU allocation will occur.", flush=True)
                  time.sleep(30)
                  continue
              active = pattern.findall(output)
              if not active:
                  print("No previous TV OFF Colab session is active.")
                  raise SystemExit(0)
              print("Previous TV OFF Colab session is still active; waiting without allocating another GPU:", ", ".join(sorted(set(active))), flush=True)
              time.sleep(30)
          raise SystemExit("Previous Colab session did not close within 20 minutes; refusing overlapping generation.")
          PY
      - name: Reserve UTC slot, enforce cooldown, or recover pending pair
        id: reserve-slot
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("music_shorts_state.json")
          if not path.is_file():
              raise SystemExit("GitHub publication state is missing; refusing a new production run.")
          state = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(state, dict):
              raise SystemExit("Repository publication state is not a JSON object")
          for key in ("_published_audio_sha256", "_published_video_sha256", "_published_full_video_sha256", "_processed_utc_slots", "published_tracks"):
              value = state.setdefault(key, [])
              if not isinstance(value, list):
                  raise SystemExit(f"Publication state field {key} is invalid")
          pending = [
              item for item in state["published_tracks"]
              if isinstance(item, dict)
              and item.get("short_video_id")
              and item.get("full_upload_status") != "published"
          ]
          should_run = False
          should_resume = False
          resume_run_id = ""
          skip = ""
          if pending:
              item = pending[-1]
              resume_run_id = str(item.get("production_run_id") or "").strip()
              if not resume_run_id.isdigit():
                  raise SystemExit("A Short has no confirmed full-track ID, but its source GitHub run ID is missing; refusing a new generation to prevent losing the pair.")
              should_run = False
              should_resume = True
              skip = "recover_pending_full_track"
              print("Pending pair detected; will recover original Colab artifact from run", resume_run_id)
          else:
              now = datetime.now(timezone.utc)
              slot = now.replace(minute=0, second=0, microsecond=0).strftime("%Y-%m-%dT%H:00:00Z")
              processed = state["_processed_utc_slots"]
              if slot in processed:
                  skip = "utc_slot_already_processed"
              last_value = state.get("_last_published_at")
              if not skip and last_value:
                  last = datetime.fromisoformat(str(last_value).replace("Z", "+00:00"))
                  if last.tzinfo is None:
                      last = last.replace(tzinfo=timezone.utc)
                  remaining = 3600 - (now - last.astimezone(timezone.utc)).total_seconds()
                  if remaining > 0:
                      skip = f"cooldown_active_{int(remaining)}s"
              if not skip:
                  processed.append(slot)
                  state["_processed_utc_slots"] = processed[-500:]
                  should_run = True
          if skip and should_run:
              raise SystemExit(f"Unsafe reservation: skip_reason={skip} while should_run=true; refusing GPU allocation.")
          if should_run and should_resume:
              raise SystemExit("Unsafe reservation: new generation and pending-pair recovery cannot both be enabled.")
          path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("should_run=" + ("true" if should_run else "false") + "\n")
              out.write("should_resume_pending=" + ("true" if should_resume else "false") + "\n")
              out.write("resume_run_id=" + resume_run_id + "\n")
              out.write("skip_reason=" + (skip or "none") + "\n")
          if should_resume:
              print("Recovering previously uploaded Short's missing full track; no new GPU generation.")
          elif not skip:
              print("Production approved for UTC slot", slot)
          else:
              print("Production skipped:", skip)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music_shorts_state.json
          git commit -m "Reserve TV OFF UTC production slot or prepare pair recovery" || echo "State unchanged"
          git push

      - name: Install audio/video packaging dependencies
        if: steps.reserve-slot.outputs.should_run == 'true' || steps.reserve-slot.outputs.should_resume_pending == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Use the pinned imageio-ffmpeg wheel instead of assuming the hosted
          # Ubuntu image has system FFmpeg/ffprobe preinstalled.
          python -m pip install --disable-pip-version-check --retries 3 --timeout 30 -r requirements.txt
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg
          from PIL import Image
          ffmpeg = Path(imageio_ffmpeg.get_ffmpeg_exe())
          if not ffmpeg.is_file():
              raise SystemExit("Bundled imageio-ffmpeg executable is missing")
          version = subprocess.run([str(ffmpeg), "-version"], capture_output=True, text=True, check=True, timeout=30)
          encoders = subprocess.run([str(ffmpeg), "-hide_banner", "-encoders"], capture_output=True, text=True, check=True, timeout=30)
          filters = subprocess.run([str(ffmpeg), "-hide_banner", "-filters"], capture_output=True, text=True, check=True, timeout=30)
          available = encoders.stdout + encoders.stderr
          available_filters = filters.stdout + filters.stderr
          for required in ("libx264", "aac"):
              if required not in available:
                  raise SystemExit(f"Bundled FFmpeg is missing required encoder: {required}")
          if "loudnorm" not in available_filters:
              raise SystemExit("Bundled FFmpeg is missing the required loudnorm filter")
          print(version.stdout.splitlines()[0])
          print("Bundled FFmpeg, libx264, AAC, loudnorm, and Pillow image validation are ready.")
          PY
      - name: Prepare Colab-compatible unified notebook
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("colab/tv-off-unified/tv_off_unified.ipynb")
          nb = json.loads(src.read_text(encoding="utf-8"))
          for cell in nb.get("cells", []):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              if isinstance(source, list):
                  source = "".join(source)
              if not isinstance(source, str):
                  raise SystemExit("Notebook code cell source must be text.")
              cell["source"] = source
              cell["outputs"] = []
              cell["execution_count"] = None
          out = Path("/tmp/tv_off_colab_unified.ipynb")
          out.write_text(json.dumps(nb, ensure_ascii=False), encoding="utf-8")
          print("Prepared", out, "cells=", len(nb.get("cells", [])))
          PY
      - name: Allocate Colab T4 (exponential recovery for transient service errors)
        id: allocate-colab
        if: steps.reserve-slot.outputs.should_run == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Colab assignment has returned HTTP 503. Space retries to avoid
          # hammering the same endpoint; reconcile sessions after every error.
          delays=(60 120 240 360)
          for attempt in 1 2 3 4 5; do
            echo "Colab T4 allocation attempt $attempt/5"
            set +e
            ALLOC_LOG="$(timeout --signal=TERM --kill-after=20s 180s colab --auth oauth2 new -s tv-off-prod --gpu T4 2>&1)"
            ALLOC_RC=$?
            set -e
            printf '%s\n' "$ALLOC_LOG"
            if [ "$ALLOC_RC" -eq 0 ]; then
              echo "Colab T4 allocation succeeded."
              exit 0
            fi
            echo "Colab allocation attempt $attempt failed with exit $ALLOC_RC; reconciling session state."
            set +e
            SESSIONS_OUTPUT="$(timeout 30s colab --auth oauth2 sessions 2>&1)"
            SESSIONS_RC=$?
            set -e
            printf '%s\n' "$SESSIONS_OUTPUT"
            if [ "$SESSIONS_RC" -ne 0 ]; then
              echo "Cannot verify Colab session state after allocation failure; refusing another allocation."
              exit "$ALLOC_RC"
            fi
            if printf '%s\n' "$SESSIONS_OUTPUT" | grep -Eq '(^|[^[:alnum:]_-])tv-off-prod([^[:alnum:]_-]|$)'; then
              echo "The requested tv-off-prod session exists despite the allocation response; continuing with that single session."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay="${delays[$((attempt - 1))]}"
              echo "No tv-off-prod session exists; waiting ${delay}s before the next bounded attempt."
              sleep "$delay"
            fi
          done
          echo "Colab T4 allocation failed after five spaced attempts; no session was left active."
          exit 1
      - name: Execute unified ACE-Step + SDXL on Colab (safe retry)
        if: steps.reserve-slot.outputs.should_run == 'true'
        timeout-minutes: 50
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Unified ACE-Step + SDXL execution attempt $attempt/2"
            set +e
            timeout --signal=TERM --kill-after=30s 20m colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f /tmp/tv_off_colab_unified.ipynb
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Unified Colab generation completed."
              exit 0
            fi
            echo "Colab execution failed with exit $rc; stopping and verifying the session before any retry."
            set +e
            colab --auth oauth2 stop -s tv-off-prod
            stop_rc=$?
            sessions="$(colab --auth oauth2 sessions 2>&1)"
            sessions_rc=$?
            set -e
            echo "$sessions"
            if [ "$sessions_rc" -ne 0 ] || printf '%s\n' "$sessions" | grep -Eq '(^|[^[:alnum:]_-])tv-off-prod([^[:alnum:]_-]|$)'; then
              echo "Could not confirm the failed Colab session is closed; refusing another GPU allocation."
              exit "$rc"
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Safe Colab execution retry budget exhausted."
              exit "$rc"
            fi
            echo "Previous Colab session is confirmed closed; allocating one clean retry session."
            colab --auth oauth2 new -s tv-off-prod --gpu T4
          done
      - name: Package and verify generated assets on Colab (retry transient CLI errors)
        if: steps.reserve-slot.outputs.should_run == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Colab packaging attempt $attempt/3"
            set +e
            PACKAGE_LOG="$(timeout --signal=TERM --kill-after=30s 8m colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f tools/colab_package_output.py 2>&1)"
            PACKAGE_RC=$?
            set -e
            printf '%s\n' "$PACKAGE_LOG"
            if [ "$PACKAGE_RC" -eq 0 ] && printf '%s\n' "$PACKAGE_LOG" | grep -q 'COLAB_OUTPUT_PACKAGE_OK'; then
              echo "Colab package success marker verified."
              exit 0
            fi
            echo "Colab packaging attempt $attempt did not produce a verified archive."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "Colab packaging failed after three verified attempts."
          exit 1
      - name: Download and verify Colab production assets
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p colab-output
          download_ok=false
          for attempt in 1 2 3; do
            echo "Colab artifact download attempt $attempt/3"
            rm -f /tmp/tv_off_colab_production.zip
            if timeout 180s colab --auth oauth2 download -s tv-off-prod /content/tv_off_colab_dry_run.zip /tmp/tv_off_colab_production.zip; then
              download_ok=true
              break
            fi
            sleep $((attempt * 15))
          done
          [ "$download_ok" = true ] || { echo "Colab artifact download failed after three attempts."; exit 1; }
          python - <<'PY'
          import zipfile, json, hashlib
          from pathlib import Path
          archive = Path("/tmp/tv_off_colab_production.zip")
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              required = {"ace_step_smoke_result.json"}
              if not required.issubset(names):
                  raise SystemExit("Colab archive missing production manifest")
              z.extractall("colab-output")
          root = Path("colab-output")
          m = json.loads((root / "ace_step_smoke_result.json").read_text())
          if m.get("status") != "ok" or m.get("publishing_enabled") is not True:
              raise SystemExit("Colab manifest is not approved for production")
          for key, hash_key in [("audio_file","sha256"),("visual_file","visual_sha256"),("landscape_file","landscape_sha256")]:
              p = root / m[key]
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != m.get(hash_key):
                  raise SystemExit(f"Colab asset failed SHA-256 validation: {key}")
          print("COLAB PRODUCTION ASSETS VERIFIED:", m["title"], m["style"], m["duration_seconds"], "seconds")
          PY
      - name: Always release and verify Colab T4
        if: always() && steps.allocate-colab.outcome != 'skipped'
        run: |
          set +e
          STOP_OUTPUT="$(timeout 90s colab --auth oauth2 stop -s tv-off-prod 2>&1)"
          STOP_RC=$?
          set -e
          echo "$STOP_OUTPUT"
          echo "Colab stop exit code: $STOP_RC"
          set +e
          SESSIONS_OUTPUT="$(timeout 30s colab --auth oauth2 sessions 2>&1)"
          SESSIONS_RC=$?
          set -e
          echo "$SESSIONS_OUTPUT"
          if [ "$SESSIONS_RC" -ne 0 ]; then
            echo "Cannot verify Colab session closure; refusing downstream publishing."
            exit 1
          fi
          if printf '%s\n' "$SESSIONS_OUTPUT" | grep -Eq '(^|[^[:alnum:]_-])tv-off-prod([^[:alnum:]_-]|$)'; then
            echo "Colab session tv-off-prod is still active; refusing downstream publishing."
            exit 1
          fi
          echo "Colab production session is absent from the active-session list."
      - name: Install optional Blender renderer (non-blocking)
        if: steps.reserve-slot.outputs.should_run == 'true' || steps.reserve-slot.outputs.should_resume_pending == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          if command -v blender >/dev/null 2>&1; then
            blender --version
            exit 0
          fi
          echo "Blender is not preinstalled on this runner; using the verified SDXL visual fallback."
          exit 0

      - name: Download original Colab artifact for pending-pair recovery
        if: steps.reserve-slot.outputs.should_resume_pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ steps.reserve-slot.outputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tv-off-resume
          gh run download "$RESUME_RUN_ID" --repo "${GITHUB_REPOSITORY}" --name tv-off-unified-sdxl-production --dir /tmp/tv-off-resume
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path("/tmp/tv-off-resume/colab-output")
          manifests=list(root.rglob("ace_step_smoke_result.json"))
          if len(manifests)!=1:
              raise SystemExit(f"Expected exactly one original Colab manifest; found {len(manifests)}")
          m=json.loads(manifests[0].read_text(encoding="utf-8"))
          if m.get("status")!="ok" or m.get("publishing_enabled") is not True:
              raise SystemExit("Original Colab manifest is not approved for production recovery")
          for key,hkey in (("audio_file","sha256"),("visual_file","visual_sha256"),("landscape_file","landscape_sha256")):
              p=(manifests[0].parent/m[key]).resolve()
              if not p.is_relative_to(root.resolve()) or not p.is_file():
                  raise SystemExit(f"Original artifact missing {key}")
              if hashlib.sha256(p.read_bytes()).hexdigest()!=m.get(hkey):
                  raise SystemExit(f"Original artifact SHA-256 mismatch: {key}")
          print("Original Colab artifact restored and SHA-256 verified:",m["title"])
          PY

      - name: Build and publish Short + complete original track
        if: steps.reserve-slot.outputs.should_run == 'true' || steps.reserve-slot.outputs.should_resume_pending == 'true'
        env:
          PUBLISH_MODE: publish
          SOURCE_AUDIO_DIR: ${{ steps.reserve-slot.outputs.should_resume_pending == 'true' && '/tmp/tv-off-resume/colab-output' || 'colab-output' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "YouTube pair publish attempt $attempt/4"
            set +e
            python build_and_upload_music_short.py
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            pending="$(python - <<'PY'
          import json, os
          from pathlib import Path
          import hashlib
          root=Path(os.environ["SOURCE_AUDIO_DIR"])
          manifests=list(root.rglob("ace_step_smoke_result.json"))
          if len(manifests)!=1:
              print("false"); raise SystemExit(0)
          m=json.loads(manifests[0].read_text())
          digest=m.get("sha256")
          state=json.loads(Path("music_shorts_state.json").read_text())
          print("true" if any(isinstance(x,dict) and x.get("audio_sha256")==digest and x.get("short_video_id") and x.get("full_upload_status")!="published" for x in state.get("published_tracks",[])) else "false")
          PY
          )"
            if [ "$pending" != "true" ] || [ "$attempt" -eq 4 ]; then
              echo "No safe pending-full-only retry is available, or retry budget exhausted."
              exit "$rc"
            fi
            sleep $((attempt * 30))
          done

      - name: Verify both YouTube IDs and completed pair in GitHub state
        if: steps.reserve-slot.outputs.should_run == 'true' || steps.reserve-slot.outputs.should_resume_pending == 'true'
        env:
          SOURCE_AUDIO_DIR: ${{ steps.reserve-slot.outputs.should_resume_pending == 'true' && '/tmp/tv-off-resume/colab-output' || 'colab-output' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, os
          from pathlib import Path
          root=Path(os.environ["SOURCE_AUDIO_DIR"])
          manifests=list(root.rglob("ace_step_smoke_result.json"))
          if len(manifests)!=1:
              raise SystemExit(f"Expected one production manifest; found {len(manifests)}")
          m=json.loads(manifests[0].read_text(encoding="utf-8"))
          tracks=json.loads(Path("music_shorts_state.json").read_text(encoding="utf-8")).get("published_tracks",[])
          match=next((x for x in reversed(tracks) if isinstance(x,dict) and x.get("audio_sha256")==m.get("sha256")),None)
          if not match:
              raise SystemExit("No GitHub state record exists for this exact audio SHA-256.")
          short_id=str(match.get("short_video_id") or "")
          full_id=str(match.get("full_video_id") or "")
          valid=re.compile(r"^[A-Za-z0-9_-]{11}$")
          if not valid.fullmatch(short_id) or not valid.fullmatch(full_id):
              raise SystemExit("Both real 11-character YouTube video IDs are required.")
          if match.get("full_upload_status")!="published":
              raise SystemExit("Full-track upload is not confirmed as published.")
          if short_id==full_id:
              raise SystemExit("Short and full-track IDs must be different.")
          print("PAIR PUBLISHED AND RECORDED:",f"https://youtu.be/{short_id}",f"https://youtu.be/{full_id}")
          PY

      - name: Persist publication state to GitHub
        if: always() && (steps.reserve-slot.outputs.should_run == 'true' || steps.reserve-slot.outputs.should_resume_pending == 'true')
        run: |
          set -euo pipefail
          test -f music_shorts_state.json || {
            echo "Publication state is missing; refusing to mirror an empty state."
            exit 1
          }
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("music_shorts_state.json").read_text(encoding="utf-8"))
          if not isinstance(state,dict):
              raise SystemExit("Publication state is invalid")
          print("GitHub state mirror:",len(state.get("_published_audio_sha256",[])),"audio hashes;",len(state.get("published_tracks",[])),"track records")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music_shorts_state.json
          git commit -m "Mirror verified TV OFF publication state" || echo "No state changes to mirror"
          git push

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-unified-sdxl-production
          path: |
            colab-output/
            music-shorts/
            music_shorts_state.json
          if-no-files-found: warn
          retention-days: 7
