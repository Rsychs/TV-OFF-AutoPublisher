name: TV OFF Unified ACE-Step + SDXL — production publish
on:
  schedule:
    - cron: '0 * * * *'
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
jobs:
  production-publish:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.title == 'TV OFF Unified SDXL Dry Run' &&
       github.event.comment.body == '/publish-unified-sdxl' &&
       github.event.comment.user.login == 'Rsychs')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tv-off-sdxl-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo 'Missing Kaggle credentials: set KAGGLE_API_TOKEN or KAGGLE_USERNAME + KAGGLE_KEY'
            exit 1
          fi
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade six kaggle
      - name: Push unified Kaggle kernel
        id: push-kernel
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/tv-off-unified --timeout 1800
      - name: Wait for Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            STATUS="$(kaggle kernels status TVOffset/tv-off-unified-ace-step-sdxl-turbo 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eiq 'complete|success'; then exit 0; fi
            if echo "$STATUS" | grep -Eiq 'error|failed'; then
              echo "Kaggle kernel entered an error state; refusing to download stale output."
              exit 1
            fi
            sleep 30
          done
          echo 'Timed out waiting for Kaggle kernel'
          exit 1
      - name: Verify Kaggle process is fully closed
        if: always()
        env:
          KERNEL_ID: TVOffset/tv-off-unified-ace-step-sdxl-turbo
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            STATUS="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            echo "Post-run Kaggle status ($attempt/10): $STATUS"
            if echo "$STATUS" | grep -Eiq 'complete|success'; then
              if echo "$STATUS" | grep -Eiq 'running|queued|starting|initializing'; then
                echo "Kaggle still reports an active state; refusing to continue."
                exit 1
              fi
              echo "Kaggle process is closed."
              exit 0
            fi
            if echo "$STATUS" | grep -Eiq 'error|fail|cancel'; then
              echo "Kaggle process ended unsuccessfully."
              exit 1
            fi
            sleep 15
          done
          echo "Could not confirm Kaggle process closure."
          exit 1

      - name: Download Kaggle output
        run: |
          mkdir -p kaggle-output
          kaggle kernels output TVOffset/tv-off-unified-ace-step-sdxl-turbo -p kaggle-output
      - name: Save completed original song to Dropbox
        env:
          DROPBOX_MUSIC_APP_KEY: ${{ secrets.DROPBOX_MUSIC_APP_KEY }}
          DROPBOX_MUSIC_APP_SECRET: ${{ secrets.DROPBOX_MUSIC_APP_SECRET }}
          DROPBOX_MUSIC_REFRESH_TOKEN: ${{ secrets.DROPBOX_MUSIC_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import requests

          required = ["DROPBOX_MUSIC_APP_KEY", "DROPBOX_MUSIC_APP_SECRET", "DROPBOX_MUSIC_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing Dropbox Music secrets: " + ", ".join(missing))
          root = Path("kaggle-output")
          manifests = list(root.rglob("ace_step_smoke_result.json"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected one generation manifest, found {len(manifests)}")
          manifest_path = manifests[0]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "ok" or manifest.get("publishing_enabled") is not True:
              raise SystemExit("Refusing to save an unverified or non-production track")
          title = str(manifest.get("title", "")).strip()
          if not title or any(ch.isdigit() for ch in title):
              raise SystemExit("Public track title must be non-empty and contain no digits")
          audio_files = [manifest.get("audio_file"), manifest.get("mp3_file")]
          audio_files = [name for name in audio_files if name]
          if not audio_files:
              raise SystemExit("Manifest contains no audio files")
          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["DROPBOX_MUSIC_REFRESH_TOKEN"]},
              auth=(os.environ["DROPBOX_MUSIC_APP_KEY"], os.environ["DROPBOX_MUSIC_APP_SECRET"]),
              timeout=30,
          )
          token_response.raise_for_status()
          access_token = token_response.json()["access_token"]
          saved = []
          for name in audio_files + [manifest_path.name]:
              local = (manifest_path.parent / name).resolve()
              if not local.is_relative_to(root.resolve()) or not local.is_file():
                  raise SystemExit(f"Missing or unsafe production file: {name}")
              digest = hashlib.sha256(local.read_bytes()).hexdigest()
              if name == manifest.get("audio_file") and digest != manifest.get("sha256"):
                  raise SystemExit("WAV SHA-256 does not match generation manifest")
              target = "/" + local.name
              headers = {
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": "application/octet-stream",
                  "Dropbox-API-Arg": json.dumps({
                      "path": target, "mode": "add", "autorename": False,
                      "mute": True, "strict_conflict": True
                  }, separators=(",", ":")),
              }
              with local.open("rb") as stream:
                  response = requests.post(
                      "https://content.dropboxapi.com/2/files/upload",
                      headers=headers, data=stream, timeout=600
                  )
              if not response.ok:
                  raise SystemExit(f"Dropbox upload failed for {name}: {response.status_code} {response.text}")
              result = response.json()
              if result.get("path_display") != target or result.get("size") != local.stat().st_size:
                  raise SystemExit(f"Dropbox metadata mismatch for {name}")
              verify = requests.post(
                  "https://api.dropboxapi.com/2/files/get_metadata",
                  headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
                  json={"path": target}, timeout=30
              )
              if not verify.ok or verify.json().get("size") != local.stat().st_size:
                  raise SystemExit(f"Dropbox verification failed for {name}")
              saved.append(target)
          print("DROPBOX SONG SAVE VERIFIED:")
          for path in saved:
              print(path)
          PY
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Build and publish Short + complete original track
        env:
          PUBLISH_MODE: publish
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_music_short.py
      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-unified-sdxl-production
          path: |
            kaggle-output/
            music-shorts/
          if-no-files-found: warn
          retention-days: 7
