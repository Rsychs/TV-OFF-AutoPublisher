name: TV OFF Unified ACE-Step + SDXL — production publish
on:
  schedule:
    - cron: '0 * * * *'
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: read
  issues: read
jobs:
  production-publish:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 30 &&
       github.event.issue.title == 'TV OFF Colab Unified Dry Run' &&
       (github.event.comment.body == '/publish-colab-unified' || github.event.comment.body == '/publish-colab-unified-force') &&
       github.event.comment.user.login == 'Rsychs') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.title == 'TV OFF Unified SDXL Dry Run' &&
       github.event.comment.body == '/publish-unified-sdxl' &&
       github.event.comment.user.login == 'Rsychs')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/colab-cli-gpu-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unified ACE-Step + SDXL notebook source and syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json
          from pathlib import Path
          path = Path("kaggle/tv-off-unified/tv_off_unified.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          if notebook.get("nbformat") != 4:
              raise SystemExit("Unified notebook must use nbformat 4")
          checked = 0
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              source_text = "".join(source) if isinstance(source, list) else source
              if not isinstance(source_text, str):
                  raise SystemExit(f"Notebook cell {index} has invalid source")
              ast.parse(source_text, filename=f"{path}:cell-{index}")
              checked += 1
          if checked < 2:
              raise SystemExit("Expected ACE-Step and SDXL executable notebook cells")
          print(f"Validated Python syntax in {checked} notebook cells.")
          PY
      - name: Restore Colab CLI OAuth credentials
        if: always()
        env:
          COLAB_OAUTH_TOKEN_JSON: ${{ secrets.COLAB_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "${COLAB_OAUTH_TOKEN_JSON:-}" || { echo "Missing COLAB_OAUTH_TOKEN_JSON"; exit 1; }
          mkdir -p "$HOME/.config/colab-cli"
          printf '%s' "$COLAB_OAUTH_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
          chmod 600 "$HOME/.config/colab-cli/token.json"
          python -m pip install --disable-pip-version-check --quiet google-colab-cli keyrings.alt
      - name: Reserve UTC slot and enforce shared cooldown
        id: reserve-slot
        env:
          TV_OFF_FORCE_RUN: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/publish-colab-unified-force' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("music_shorts_state.json")
          state = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          if not isinstance(state, dict):
              raise SystemExit("Repository publication state is not a JSON object")
          for key in ("_published_audio_sha256", "_published_video_sha256", "_published_full_video_sha256", "_processed_utc_slots", "published_tracks"):
              value = state.setdefault(key, [])
              if not isinstance(value, list):
                  raise SystemExit(f"Publication state field {key} is invalid")

          # Preserve verified publications that predate repository-backed state.
          historical = [
            {"short_video_id":"A9OHx8aAq8M","short_url":"https://youtu.be/A9OHx8aAq8M","full_video_id":"pH1BCfgtHus","full_url":"https://youtu.be/pH1BCfgtHus","track_title":"Midnight Pavilion 61221 — Korean Gugak","style":"Instrumental Korean gugak chamber / courtly jeongak ensemble with pentatonic ujo melody and heterophonic acoustic instrumentation","audio_sha256":"46f0aa095617fce86095e756972f9d107f8e55e7cd22f8bd83e32e3a1c5e3b9e","short_video_sha256":"73559691d4c519af01f0648eac0b81db2b0edd8279a65ac7ed70655c2a45ad08","full_video_sha256":"6a5b07b2d1dafd64f597825d9e06f573c592afe56e284d9abde0c762bcb5fd87","duration_seconds":174.0,"short_published_at":"2026-11-21T13:57:28.751622+00:00","full_published_at":"2026-11-21T13:57:28.751651+00:00","full_upload_status":"published"},
            {"short_video_id":"0DibjqE_k3Q","short_url":"https://youtu.be/0DibjqE_k3Q","full_video_id":"hTiUvLQxXZo","full_url":"https://youtu.be/hTiUvLQxXZo","track_title":"Neon Afterglow 83184","style":"Electro Instrumental","audio_sha256":"b0e94f4f9217d2470820897de9a92a4e7b086bc768c6017baa73fd94ded8d1d7","short_video_sha256":"0a26bda28d055c160f35d77cc21f844d9c5ff5bb9e7c127573b8420288db06f5","full_video_sha256":"6e823d6a8e6313aeec9d906870deec9bfc0587572c3fa7ea961eb5dfce2da1ae","visual_sha256":"610740b036682f934b9561a8e0529641f7bcad2f4165a95a7643b6be3fcd2af1","duration_seconds":174.0,"short_published_at":"2026-11-21T14:41:07.830759+00:00","full_published_at":"2026-11-21T14:41:07.831006+00:00","full_upload_status":"published"}
          ]
          by_audio = {x.get("audio_sha256"): x for x in state["published_tracks"] if isinstance(x, dict) and x.get("audio_sha256")}
          for item in historical:
              by_audio.setdefault(item["audio_sha256"], item)
              for key, value in (("_published_audio_sha256",item["audio_sha256"]),("_published_video_sha256",item["short_video_sha256"]),("_published_full_video_sha256",item["full_video_sha256"])):
                  if value not in state[key]: state[key].append(value)
          state["published_tracks"] = list(by_audio.values())[-500:]

          published = []
          for item in state["published_tracks"]:
              for field in ("published_at","short_published_at","full_published_at"):
                  if item.get(field):
                      dt = datetime.fromisoformat(str(item[field]).replace("Z","+00:00"))
                      if dt.tzinfo is None: dt = dt.replace(tzinfo=timezone.utc)
                      published.append(dt.astimezone(timezone.utc))
          if state.get("_last_published_at"):
              dt = datetime.fromisoformat(str(state["_last_published_at"]).replace("Z","+00:00"))
              if dt.tzinfo is None: dt = dt.replace(tzinfo=timezone.utc)
              published.append(dt.astimezone(timezone.utc))
          if published: state["_last_published_at"] = max(published).isoformat()

          now = datetime.now(timezone.utc)
          slot = now.replace(minute=0,second=0,microsecond=0).strftime("%Y-%m-%dT%H:00:00Z")
          processed = state["_processed_utc_slots"]
          force_run = __import__("os").environ.get("TV_OFF_FORCE_RUN", "false").lower() == "true"
          skip = "utc_slot_already_processed" if slot in processed else ""
          if not skip and state.get("_last_published_at"):
              last = datetime.fromisoformat(str(state["_last_published_at"]).replace("Z","+00:00"))
              if last.tzinfo is None: last = last.replace(tzinfo=timezone.utc)
              remaining = 3600 - (now-last.astimezone(timezone.utc)).total_seconds()
              if remaining > 0: skip = f"cooldown_active_{int(remaining)}s"
          if force_run:
              print("ONE-TIME MANUAL OVERRIDE: bypassing UTC-slot and 60-minute cooldown guards; hash deduplication and concurrency lock remain enabled.")
              skip = ""
          if slot not in processed: processed.append(slot)
          state["_processed_utc_slots"] = processed[-500:]
          path.write_text(json.dumps(state,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("Reserved UTC slot:",slot,"| last confirmed publication:",state.get("_last_published_at","none"))
          print("Production skipped:" if skip else "Production approved:",skip or "no")
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("should_run="+("false" if skip else "true")+"\n")
              out.write("skip_reason="+(skip or "none")+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music_shorts_state.json
          git commit -m "Reserve TV OFF UTC production slot" || echo "State reservation already committed"
          git push
      - name: Prepare Colab-compatible unified notebook
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("kaggle/tv-off-unified/tv_off_unified.ipynb")
          nb = json.loads(src.read_text(encoding="utf-8"))
          for cell in nb.get("cells", []):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              if isinstance(source, list):
                  source = "".join(source)
              if not isinstance(source, str):
                  raise SystemExit("Notebook code cell source must be text.")
              source = source.replace("/kaggle/working", "/content")
              cell["source"] = source
              cell["outputs"] = []
              cell["execution_count"] = None
          out = Path("/tmp/tv_off_colab_unified.ipynb")
          out.write_text(json.dumps(nb, ensure_ascii=False), encoding="utf-8")
          print("Prepared", out, "cells=", len(nb.get("cells", [])))
          PY
      - name: Allocate Colab T4
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: colab --auth oauth2 new -s tv-off-prod --gpu T4
      - name: Execute unified ACE-Step + SDXL on Colab
        if: steps.reserve-slot.outputs.should_run == 'true'
        timeout-minutes: 210
        run: colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f /tmp/tv_off_colab_unified.ipynb
      - name: Package and verify generated assets on Colab
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: colab --auth oauth2 exec -s tv-off-prod --timeout 0 -f tools/colab_package_output.py
      - name: Download and verify Colab production assets
        if: steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          colab --auth oauth2 download -s tv-off-prod /content/tv_off_colab_dry_run.zip /tmp/tv_off_colab_production.zip
          python - <<'PY'
          import zipfile, json, hashlib
          from pathlib import Path
          archive = Path("/tmp/tv_off_colab_production.zip")
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              required = {"ace_step_smoke_result.json"}
              if not required.issubset(names):
                  raise SystemExit("Colab archive missing production manifest")
              z.extractall("kaggle-output")
          root = Path("kaggle-output")
          m = json.loads((root / "ace_step_smoke_result.json").read_text())
          if m.get("status") != "ok" or m.get("publishing_enabled") is not True:
              raise SystemExit("Colab manifest is not approved for production")
          for key, hash_key in [("audio_file","sha256"),("visual_file","visual_sha256"),("landscape_file","landscape_sha256")]:
              p = root / m[key]
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != m.get(hash_key):
                  raise SystemExit(f"Colab asset failed SHA-256 validation: {key}")
          print("COLAB PRODUCTION ASSETS VERIFIED:", m["title"], m["style"], m["duration_seconds"], "seconds")
          PY
      - name: Always release Colab T4
        if: always() && steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set +e
          colab --auth oauth2 stop -s tv-off-prod
          exit 0
      - name: Set up Python for Blender rendering
        if: steps.reserve-slot.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        if: steps.reserve-slot.outputs.should_run == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgbm1 libx11-6 libxi6 libxrender1 libxfixes3 libsm6 libxxf86vm1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1
          sudo ldconfig
          python -m pip install --disable-pip-version-check --retries 3 --timeout 60 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 3 --timeout 60 "bpy==4.2.0"
          FONT_DIR="$(python -c 'import matplotlib; print(matplotlib.get_data_path() + "/fonts/ttf")')"
          sudo mkdir -p /usr/share/fonts/truetype/dejavu
          sudo install -m 0644 "$FONT_DIR/DejaVuSans-Bold.ttf" /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          sudo install -m 0644 "$FONT_DIR/DejaVuSans.ttf" /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          echo "EGL_PLATFORM=surfaceless" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          python -m py_compile build_and_upload_music_short.py scripts/render_tv_off_short_scene.py
      - name: Build and publish Short + complete original track
        if: steps.reserve-slot.outputs.should_run == 'true'
        env:
          PUBLISH_MODE: publish
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_music_short.py

      - name: Persist publication state to GitHub
        if: success() && steps.reserve-slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("music_shorts_state.json")
          state=json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(state,dict): raise SystemExit("Publication state is invalid")
          print("Publication state ready:",len(state.get("_published_audio_sha256",[])),"audio hashes;",len(state.get("published_tracks",[])),"track records")
          PY
          git add music_shorts_state.json
          git commit -m "Persist TV OFF publication state" || echo "No publication state changes to commit"
          git push

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-unified-sdxl-production
          path: |
            kaggle-output/
            music-shorts/
            music_shorts_state.json
          if-no-files-found: warn
          retention-days: 7
