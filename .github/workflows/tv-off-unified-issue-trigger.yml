name: TV OFF Unified ACE-Step + SDXL — production publish
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
jobs:
  production-publish:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'TV OFF Unified SDXL Dry Run' &&
      github.event.comment.body == '/publish-unified-sdxl' &&
      github.event.comment.user.login == 'Rsychs'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tv-off-sdxl-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo 'Missing Kaggle credentials: set KAGGLE_API_TOKEN or KAGGLE_USERNAME + KAGGLE_KEY'
            exit 1
          fi
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade six kaggle
      - name: Push unified Kaggle kernel
        id: push-kernel
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/tv-off-unified
      - name: Wait for Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS="$(kaggle kernels status TVOffset/tv-off-unified-ace-step-sdxl-turbo 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eiq 'complete|success'; then exit 0; fi
            if echo "$STATUS" | grep -Eiq 'error|failed'; then
              echo "Kaggle kernel entered an error state; refusing to download stale output."
              exit 1
            fi
            sleep 30
          done
          echo 'Timed out waiting for Kaggle kernel'
          exit 1
      - name: Download Kaggle output
        run: |
          mkdir -p kaggle-output
          kaggle kernels output TVOffset/tv-off-unified-ace-step-sdxl-turbo -p kaggle-output
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Build and publish Short + complete original track
        env:
          PUBLISH_MODE: publish
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_and_upload_music_short.py
      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-off-unified-sdxl-production
          path: |
            kaggle-output/
            music-shorts/
          if-no-files-found: warn
          retention-days: 7
