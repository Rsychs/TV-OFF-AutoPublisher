name: TV OFF - Refresh All Published Thumbnails

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tv-off-thumbnail-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.issue.number == 15 &&
      github.event.comment.user.login == 'Rsychs' &&
      github.event.comment.body == '/tv-off-refresh-thumbnails'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pillow

      - name: Regenerate and apply branded thumbnails to every published long-form video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python refresh_published_thumbnails.py
