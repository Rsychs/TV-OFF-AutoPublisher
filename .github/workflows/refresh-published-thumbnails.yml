name: TV OFF - Refresh All Published Thumbnails

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-off-thumbnail-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pillow

      - name: Regenerate and apply the new branded thumbnails
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python refresh_published_thumbnails.py
