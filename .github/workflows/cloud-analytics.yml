name: TV OFF — Cloud analytics (OAuth)

on:
  workflow_dispatch:
  schedule:
    # Hourly safety net; workflow_dispatch is also available at any time.
    # The script records the actual Europe/Riga execution time.
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: tv-off-cloud-analytics
  cancel-in-progress: false

jobs:
  fetch-analytics:
    if: vars.TV_OFF_ANALYTICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout analytics code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch read-only analytics and upload private snapshot
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TV_OFF_ANALYTICS_START_DATE: "2020-01-01"
        run: python analytics/fetch_youtube_analytics.py
