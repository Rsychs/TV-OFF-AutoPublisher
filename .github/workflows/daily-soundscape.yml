name: TV OFF Daily Autonomous Publisher

on:
  schedule:
    - cron: "30 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-soundscape.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-off-daily-publisher
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pillow

      - name: Create today's Riga publishing slot
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_daily_schedule.py

      - name: Download a new licensed field recording
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          USED_SOURCES_FILE: ${{ github.workspace }}/used_sources.json
        run: python download_open_audio.py

      - name: Build one 10-hour black-screen video
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          MEDIA_DIR: ${{ github.workspace }}/videos
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python build_real_ambience.py

      - name: Generate thumbnail
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_thumbnails.py

      - name: Validate 10-hour video
        env:
          EXPECTED_DURATION_SECONDS: 36000
        run: |
          filename="$(python -c 'import csv; print(next(csv.DictReader(open("daily_schedule.csv", encoding="utf-8")))["filename"])')"
          python validate_media.py "videos/$filename"

      - name: Upload and schedule today's video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_DIR: ${{ github.workspace }}/videos
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python uploader.py

      - name: Persist upload and source history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json used_sources.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record daily TV OFF upload and audio source"
          fi
          git pull --rebase origin main
          git push
