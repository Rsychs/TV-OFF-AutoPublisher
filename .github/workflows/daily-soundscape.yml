name: TV OFF — 10-Hour Soundscape Video

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 15 &&
       github.event.comment.user.login == 'Rsychs' &&
       startsWith(github.event.comment.body, '/tv-off-longform '))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the latest main branch state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prevent a second long-form publication in the same 3-hour slot
        id: slot_guard
        env:
          REQUESTED_SLOT: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          requested = os.environ.get("REQUESTED_SLOT", "").strip()
          if requested:
              match = re.fullmatch(r"/tv-off-longform (\\d{8})-(\\d{2})", requested)
              if not match:
                  raise RuntimeError("Invalid long-form command; refusing to run.")

          state_path = Path("state.json")
          if not state_path.is_file():
              raise RuntimeError("state.json is missing; refusing to bypass long-form slot protection.")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if not isinstance(state, dict):
              raise RuntimeError("state.json is invalid; refusing to bypass long-form slot protection.")

          now = datetime.now(ZoneInfo("Europe/Riga"))
          slot_hour = (now.hour // 3) * 3
          date_key = now.strftime("%Y%m%d")
          slot_key = f"{slot_hour:02d}"
          if requested and (match.group(1) != date_key or match.group(2) != slot_key):
              raise RuntimeError(f"Requested long-form slot {match.group(1)}-{match.group(2)} is no longer current; refusing rollover.")
          pattern = re.compile(rf"^TV-OFF_.+_{date_key}_{slot_key}_10-Hours\.mp4$", re.IGNORECASE)
          published = [
              (name, video_id)
              for name, video_id in state.items()
              if isinstance(name, str) and pattern.match(name)
              and isinstance(video_id, str) and video_id.strip()
          ]

          skip = bool(published)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")

          if skip:
              print(f"SKIPPING: current 3-hour slot {date_key}_{slot_key} is already published: {published}")
          else:
              print(f"READY: current 3-hour slot {date_key}_{slot_key} has no published long-form video.")
          PY

      - name: Install FFmpeg and dependencies
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pillow

      - name: Create one daily soundscape publishing slot
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_daily_schedule.py

      - name: Resolve the selected soundscape
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          KIND="$(python -c 'import csv; print(next(csv.DictReader(open("daily_schedule.csv", encoding="utf-8-sig")))["soundscape"])')"
          echo "SOUNDSCAPE=$KIND" >> "$GITHUB_ENV"
          echo "Selected soundscape: $KIND"

      - name: Generate original noise or select one verified CC0 recording from Freesound
        if: steps.slot_guard.outputs.skip != 'true'
        timeout-minutes: 8
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          PREFERRED_FREESOUND_ID: "737690"
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          USED_SOURCES_FILE: ${{ github.workspace }}/used_sources.json
        run: python download_one_audio.py

      - name: Build one 10-hour black-screen soundscape video
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          MEDIA_DIR: ${{ github.workspace }}/videos
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python build_real_ambience.py

      - name: Generate soundscape thumbnail
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_thumbnails.py

      - name: Validate the finished video
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          EXPECTED_DURATION_SECONDS: "36000"
        run: |
          filename="$(python -c 'import csv; print(next(csv.DictReader(open("daily_schedule.csv", encoding="utf-8-sig")))["filename"])')"
          python validate_media.py "videos/$filename"

      - name: Refresh upload deduplication state from the latest main branch
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          git fetch origin main
          if git cat-file -e origin/main:state.json 2>/dev/null; then
            git show origin/main:state.json > state.json
          else
            printf '{}\n' > state.json
          fi

      - name: Upload and publish the soundscape video immediately on YouTube
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_DIR: ${{ github.workspace }}/videos
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python uploader.py

      - name: Persist upload state and source history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json used_sources.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record TV OFF soundscape publishing state"
          fi
          git pull --rebase origin main
          git push
