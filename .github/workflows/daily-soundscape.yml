name: TV OFF — One Fireplace Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-soundscape.yml"

permissions:
  contents: write

concurrency:
  group: tv-off-single-video
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pillow

      - name: Create one fireplace publishing slot
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_daily_schedule.py

      - name: Find and download one CC0 fireplace recording from Freesound
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          SOUNDSCAPE: fireplace
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          USED_SOURCES_FILE: ${{ github.workspace }}/used_sources.json
        run: python download_one_audio.py

      - name: Build one 10-hour black-screen fireplace video
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          MEDIA_DIR: ${{ github.workspace }}/videos
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python build_real_ambience.py

      - name: Generate fireplace thumbnail
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_thumbnails.py

      - name: Validate the finished video
        env:
          EXPECTED_DURATION_SECONDS: "36000"
        run: |
          filename="$(python -c 'import csv; print(next(csv.DictReader(open("daily_schedule.csv", encoding="utf-8")))[ "filename"])')"
          python validate_media.py "videos/$filename"

      - name: Upload and schedule the fireplace video on YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_DIR: ${{ github.workspace }}/videos
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python uploader.py

      - name: Persist upload state and source history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json used_sources.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record TV OFF fireplace video and source"
          fi
          git pull --rebase origin main
          git push
