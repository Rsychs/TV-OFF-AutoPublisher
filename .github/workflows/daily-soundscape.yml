name: TV OFF — 10-Hour Soundscape Video

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 15 &&
       github.event.comment.user.login == 'Rsychs' &&
       startsWith(github.event.comment.body, '/tv-off-longform '))
    concurrency:
      group: tv-off-single-video
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the latest main branch state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin and validate the declared Europe/Riga 3-hour slot
        id: slot_guard
        env:
          REQUESTED_SLOT: ${{ github.event.comment.body }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Riga")
          requested = os.environ.get("REQUESTED_SLOT", "").strip()
          event_name = os.environ.get("EVENT_NAME", "").strip()
          now = datetime.now(TZ)

          if event_name == "issue_comment":
              match = re.fullmatch(r"/tv-off-(?:longform|music) (\d{8})-(\d{2})", requested)
              if not match:
                  raise RuntimeError("Invalid long-form command; refusing to run.")

              created_raw = os.environ.get("COMMENT_CREATED_AT", "").strip()
              if not created_raw:
                  raise RuntimeError("Issue comment creation time is missing; refusing to infer a slot.")
              try:
                  created_at = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
                  if created_at.tzinfo is None:
                      raise ValueError("comment timestamp has no timezone")
                  created_at = created_at.astimezone(TZ)
              except ValueError as exc:
                  raise RuntimeError(f"Invalid issue comment creation time: {exc}") from exc

              slot_hour = (created_at.hour // 3) * 3
              slot_start = created_at.replace(
                  hour=slot_hour, minute=0, second=0, microsecond=0
              )
              slot_end = slot_start + timedelta(hours=3)
              expected_date = slot_start.strftime("%Y%m%d")
              expected_hour = slot_start.strftime("%H")

              if match.group(1) != expected_date or match.group(2) != expected_hour:
                  raise RuntimeError(
                      f"Requested slot {match.group(1)}-{match.group(2)} does not match "
                      f"the comment-created Europe/Riga slot {expected_date}-{expected_hour}."
                  )
              if not (slot_start <= now < slot_end):
                  raise RuntimeError(
                      f"Pinned Europe/Riga slot {expected_date}-{expected_hour} has closed; "
                      "refusing to roll over to a later slot."
                  )
          elif event_name == "workflow_dispatch":
              if requested:
                  raise RuntimeError("Manual dispatch must not supply an issue-comment slot.")
              slot_hour = (now.hour // 3) * 3
              slot_start = now.replace(
                  hour=slot_hour, minute=0, second=0, microsecond=0
              )
              slot_end = slot_start + timedelta(hours=3)
          else:
              raise RuntimeError(f"Unsupported trigger event {event_name!r}; refusing to run.")

          date_key = slot_start.strftime("%Y%m%d")
          slot_key = slot_start.strftime("%H")
          state_path = Path("state.json")
          if not state_path.is_file():
              raise RuntimeError("state.json is missing; refusing to bypass long-form slot protection.")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if not isinstance(state, dict):
              raise RuntimeError("state.json is invalid; refusing to bypass long-form slot protection.")

          pattern = re.compile(
              rf"^TV-OFF_.+_{date_key}_{slot_key}_10-Hours\.mp4$",
              re.IGNORECASE,
          )
          published = [
              (name, video_id)
              for name, video_id in state.items()
              if isinstance(name, str)
              and pattern.match(name)
              and isinstance(video_id, str)
              and re.fullmatch(r"[A-Za-z0-9_-]{11}", video_id.strip())
          ]

          skip = bool(published)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
              output.write(f"slot_date={date_key}\n")
              output.write(f"slot_hour={slot_key}\n")

          if requested.startswith("/tv-off-music "):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("FORCE_SOUND=original_music\n")
          if skip:
              print(
                  f"SKIPPING: Europe/Riga slot {date_key}-{slot_key} already has "
                  f"a confirmed YouTube ID: {published}"
              )
          else:
              print(
                  f"READY: declared Europe/Riga slot {date_key}-{slot_key}; "
                  f"window {slot_start.isoformat()}–{slot_end.isoformat()}."
              )
          PY

      - name: Install FFmpeg and dependencies
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pillow

      - name: Create one daily soundscape publishing slot
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_daily_schedule.py

      - name: Resolve the selected soundscape
        id: resolve_sound
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          KIND="$(python -c 'import csv; print(next(csv.DictReader(open("daily_schedule.csv", encoding="utf-8-sig")))["soundscape"])')"
          echo "SOUNDSCAPE=$KIND" >> "$GITHUB_ENV"
          echo "soundscape=$KIND" >> "$GITHUB_OUTPUT"
          echo "Selected soundscape: $KIND"

      - name: Generate original music without external audio sources
        if: steps.slot_guard.outputs.skip != 'true' && steps.resolve_sound.outputs.soundscape == 'original_music'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
        run: python generate_original_music.py

      - name: Generate original noise or select one verified CC0 recording
        if: steps.slot_guard.outputs.skip != 'true' && steps.resolve_sound.outputs.soundscape != 'original_music'
        timeout-minutes: 8
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          PREFERRED_FREESOUND_ID: "737690"
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          USED_SOURCES_FILE: ${{ github.workspace }}/used_sources.json
        run: python download_one_audio.py

      - name: Build one 10-hour black-screen soundscape video
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          MEDIA_DIR: ${{ github.workspace }}/videos
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python build_real_ambience.py

      - name: Generate soundscape thumbnail
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
        run: python generate_thumbnails.py

      - name: Validate the finished video
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          EXPECTED_DURATION_SECONDS: "36000"
        run: |
          filename="$(python -c 'import csv; print(next(csv.DictReader(open("daily_schedule.csv", encoding="utf-8-sig")))["filename"])')"
          python validate_media.py "videos/$filename"

      - name: Refresh upload deduplication state from the latest main branch
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          git fetch origin main
          if git cat-file -e origin/main:state.json 2>/dev/null; then
            git show origin/main:state.json > state.json
          else
            printf '{}\n' > state.json
          fi

      - name: Upload and publish the soundscape video immediately on YouTube
        if: steps.slot_guard.outputs.skip != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_DIR: ${{ github.workspace }}/videos
          SOURCE_AUDIO_DIR: ${{ github.workspace }}/generated-audio
          SCHEDULE_FILE: ${{ github.workspace }}/daily_schedule.csv
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python uploader.py

      - name: Persist upload state and source history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json used_sources.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record TV OFF soundscape publishing state"
          fi
          git pull --rebase origin main
          git push
